<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prep Station">
<meta name="theme-color" content="#F4F3ED">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%234E5D2E'/%3E%3Ctext x='90' y='124' font-size='104' text-anchor='middle' fill='%23F4F3ED' font-family='Georgia,serif' font-weight='bold'%3EP%3C/text%3E%3C/svg%3E">
<title>Prep Station</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Space+Mono:wght@400;700&display=swap');
:root{
  --paper:#F4F3ED; --card:#FCFBF6; --ink:#20241D; --muted:#7C7E70;
  --olive:#4E5D2E; --olive-2:#6E8140; --amber:#C4842A; --amber-soft:#F4E7CE;
  --line:#E5E3D6; --rust:#A9512F; --snow:#3E6B7A;
  --disp:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'Space Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:15px;line-height:1.5;padding-bottom:78px;overscroll-behavior-y:none}
h1,h2,h3{font-family:var(--disp);font-weight:800;letter-spacing:-.02em;margin:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--paper);
  padding:14px 0 10px;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:baseline;justify-content:space-between}
.brand{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:-.03em}
.brand small{font-family:var(--mono);font-weight:400;font-size:10px;color:var(--muted);
  letter-spacing:.06em;text-transform:uppercase;display:block;margin-top:-2px}
.wkcount{font-family:var(--mono);font-size:12px;color:var(--olive);font-weight:700}

/* filter chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:6px 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* recipe card */
.grid{padding:8px 0 24px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px 15px;position:relative;transition:transform .08s}
.card:active{transform:scale(.992)}
.card .cat{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--olive);font-weight:700}
.card h3{font-size:18px;line-height:1.15;margin:3px 0 8px;padding-right:52px}
.meta{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-bottom:10px}
.meta b{color:var(--ink);font-weight:600}
.badge{position:absolute;top:13px;right:14px;font-size:10px;font-weight:700;
  font-family:var(--mono);padding:3px 7px;border-radius:6px;letter-spacing:.03em}
.b-freeze{background:#E4EEF1;color:var(--snow)}
.b-part{background:var(--amber-soft);color:var(--amber)}
.b-fresh{background:#F3E4DD;color:var(--rust)}

/* macro ticker */
.macros{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.macros div{flex:1;text-align:center;padding:6px 2px;border-right:1px solid var(--line)}
.macros div:last-child{border-right:none}
.macros .v{font-family:var(--mono);font-weight:700;font-size:15px;line-height:1}
.macros .k{font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em;margin-top:2px}
.macros .kcal .v{color:var(--olive)}

.addrow{display:flex;align-items:center;gap:8px;margin-top:11px}
.addbtn{flex:1;background:var(--olive);color:#fff;border-radius:10px;padding:9px;
  font-weight:700;font-size:14px;text-align:center}
.addbtn.in{background:var(--amber-soft);color:var(--amber)}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;
  background:var(--card)}
.stepper button{width:34px;height:38px;font-size:18px;font-weight:700;color:var(--olive)}
.stepper .n{width:34px;text-align:center;font-family:var(--mono);font-weight:700;font-size:14px}
.stepper .lbl{font-size:9px;font-family:var(--mono);color:var(--muted);padding:0 8px 0 4px;
  text-transform:uppercase;letter-spacing:.04em}

/* detail overlay */
.sheet{position:fixed;inset:0;z-index:60;background:var(--paper);overflow-y:auto;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.3,.7,.2,1);
  -webkit-overflow-scrolling:touch}
.sheet.open{transform:translateY(0)}
.sheet-top{position:sticky;top:0;background:var(--paper);padding:12px 0;
  border-bottom:1px solid var(--line);z-index:2}
.sheet-top .wrap{display:flex;align-items:center;gap:12px}
.back{font-size:22px;font-weight:700;line-height:1;padding:2px 4px}
.sheet-top h2{font-size:17px;flex:1;line-height:1.1}
.sect{margin:20px 0}
.sect h4{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--olive);font-weight:700;margin:0 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.ing{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px;
  border-bottom:1px dotted var(--line)}
.ing .q{font-family:var(--mono);font-size:13px;color:var(--olive);font-weight:700;
  white-space:nowrap;flex-shrink:0}
.ing .alt{display:block;font-size:12px;color:var(--muted);font-style:italic;margin-top:2px}
.ing .subhead{font-weight:700;color:var(--muted);font-size:12px;text-transform:uppercase;
  letter-spacing:.04em}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 14px 34px;font-size:14px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:24px;height:24px;
  background:var(--olive);color:#fff;border-radius:7px;font-family:var(--mono);font-weight:700;
  font-size:12px;display:flex;align-items:center;justify-content:center}
ol.steps li:last-child{padding-bottom:0}
.callout{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--olive);
  border-radius:10px;padding:12px 14px;font-size:13.5px;margin:8px 0}
.callout.amber{border-left-color:var(--amber)}
.callout.rust{border-left-color:var(--rust)}
.callout b{font-family:var(--disp)}
.store{display:flex;gap:8px}
.store div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:10px;text-align:center}
.store .lab{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted)}
.store .val{font-family:var(--disp);font-weight:800;font-size:15px;margin-top:3px}
.tip{font-size:13.5px;padding:6px 0 6px 18px;position:relative;color:var(--ink)}
.tip::before{content:'';position:absolute;left:2px;top:11px;width:6px;height:6px;border-radius:50%;
  background:var(--amber)}

/* this week */
.summary{background:var(--ink);color:var(--paper);border-radius:16px;padding:16px;margin:12px 0}
.summary h3{color:var(--paper);font-size:15px;margin-bottom:2px}
.summary .sub{font-size:12px;color:#B9BBAB;margin-bottom:14px}
.wkmac{display:flex;gap:0}
.wkmac div{flex:1;text-align:center;border-right:1px solid #3A3E33}
.wkmac div:last-child{border-right:none}
.wkmac .v{font-family:var(--mono);font-weight:700;font-size:18px}
.wkmac .k{font-family:var(--mono);font-size:9px;color:#9A9C8C;text-transform:uppercase;margin-top:2px}
.wkitem{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  margin-bottom:10px;display:flex;align-items:center;gap:12px}
.wkitem .info{flex:1;min-width:0}
.wkitem h4{font-family:var(--disp);font-weight:700;font-size:15px;line-height:1.1;margin:0 0 3px}
.wkitem .m{font-family:var(--mono);font-size:11px;color:var(--muted)}
.rm{color:var(--rust);font-size:12px;font-weight:700;padding:6px;font-family:var(--mono)}
.empty{text-align:center;padding:60px 24px;color:var(--muted)}
.empty h3{font-size:19px;color:var(--ink);margin-bottom:8px}
.empty p{font-size:14px;margin:0 auto;max-width:280px}

/* game plan */
.plan{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.plan h4{font-family:var(--disp);font-weight:800;font-size:15px;margin:0 0 4px}
.plan .step{font-size:13.5px;padding:7px 0 7px 26px;position:relative;border-top:1px solid var(--line)}
.plan .step:first-of-type{border-top:none}
.plan .step .n{position:absolute;left:0;top:7px;font-family:var(--mono);font-weight:700;
  font-size:12px;color:var(--amber)}

/* shopping */
.shophead{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px}
.shophead .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.copy{background:var(--olive);color:#fff;font-size:12px;font-weight:700;padding:7px 12px;border-radius:9px;
  font-family:var(--mono)}
.aisle{margin:16px 0 4px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--olive);font-weight:700}
.sitem{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sitem .box{width:21px;height:21px;border:2px solid var(--line);border-radius:6px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.sitem.done .box{background:var(--olive);border-color:var(--olive)}
.sitem.done .nm{text-decoration:line-through;color:var(--muted)}
.sitem .q{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--olive);font-weight:700;
  white-space:nowrap;flex-shrink:0}
.sitem .nm{display:block}
.merged{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:400;margin-top:1px}
.sitem.done .q{color:var(--muted)}

/* guide */
.gcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}
.gcard h4{font-family:var(--disp);font-weight:800;font-size:16px;margin:0 0 8px}
.gcard p{font-size:13.5px;margin:6px 0;color:var(--ink)}
.gcard .src{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:8px}
.grow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.grow:last-child{border-bottom:none}
.grow b{font-family:var(--mono);font-size:12px;color:var(--olive)}

/* artwork, photos, links */
.thumb{position:relative;margin:-14px -15px 11px;border-radius:15px 15px 0 0;overflow:hidden;
  background:var(--line);line-height:0}
.thumb svg,.thumb img{width:100%;display:block;height:112px;object-fit:cover}
.hero{position:relative;border-radius:14px;overflow:hidden;margin-bottom:14px;line-height:0;background:var(--line)}
.hero svg,.hero img{width:100%;display:block;height:170px;object-fit:cover}
.heroacts{display:flex;gap:8px;margin:-6px 0 14px}
.heroacts button{flex:1;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:9px 6px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--ink)}
.heroacts button.go{border-color:var(--olive);color:var(--olive)}
.pdens{position:absolute;left:9px;bottom:9px;font-family:var(--mono);font-size:10px;font-weight:700;
  background:rgba(32,36,29,.82);color:#F4F3ED;padding:3px 7px;border-radius:6px;letter-spacing:.03em}
.pdens.hi{background:var(--olive)}
.linkchip{position:absolute;right:9px;bottom:9px;font-family:var(--mono);font-size:10px;font-weight:700;
  background:rgba(32,36,29,.82);color:#F4F3ED;padding:3px 7px;border-radius:6px}
.sortrow{display:flex;gap:7px;padding:2px 0 4px;overflow-x:auto;scrollbar-width:none}
.sortrow::-webkit-scrollbar{display:none}
.sortrow button{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:6px 11px;border-radius:20px;border:1px solid var(--line);
  background:transparent;color:var(--muted);white-space:nowrap}
.sortrow button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* meal plan */
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.day-h{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);padding:9px 13px 7px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.015)}
.slot{padding:10px 13px}
.slot+.slot{border-top:1px solid var(--line)}
.slot-r{display:flex;align-items:center;gap:10px;cursor:pointer}
.slot-t{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--olive);width:46px;flex:none}
.slot-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.slot-n.none{color:var(--muted);font-style:italic}
.slot-x{color:var(--muted);font-size:16px;flex:none;padding:0 2px}
.wifebar{display:flex;align-items:center;gap:8px;margin:9px 0 1px 56px;cursor:pointer}
.sw{position:relative;width:38px;height:22px;border-radius:22px;background:#CFCEC2;transition:background .18s;flex:none}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .18s}
.sw.on{background:var(--olive-2)}
.sw.on::after{transform:translateX(16px)}
.wifebar span{font-size:12px;color:var(--muted)}
.portpill{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted)}
.planhint{font-size:12px;color:var(--muted);line-height:1.45;padding:2px 2px 14px}
.pickrow{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.pickrow:last-child{border-bottom:none}
.pickrow .nm{flex:1;font-size:14px}
.pickrow .mt{font-family:var(--mono);font-size:10px;color:var(--muted)}
.pickhead{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);padding:14px 2px 7px}
.matchbtn{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--olive);
  border:1px solid var(--olive);border-radius:20px;padding:3px 9px;margin-left:8px}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--card);
  border-top:1px solid var(--line);padding:6px 0 max(6px,env(safe-area-inset-bottom));display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;
  color:var(--muted);font-size:10px;font-weight:600;font-family:var(--mono);letter-spacing:.02em}
.nav button.on{color:var(--olive)}
.nav .ic{font-size:19px;line-height:1}
.nav .dot{position:absolute;top:2px;margin-left:16px;width:7px;height:7px;background:var(--amber);
  border-radius:50%;border:1.5px solid var(--card)}
.view{display:none}
.view.on{display:block}
.hint{font-size:12px;color:var(--muted);text-align:center;padding:2px 0 10px;font-style:italic}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <div class="brand">Prep Station<small>Ollie&rsquo;s meal rotation</small></div>
  <div class="wkcount" id="wkPill">0 this week</div>
</div></div>

<!-- BROWSE -->
<div class="view on" id="v-browse"><div class="wrap">
  <div class="chips" id="chips"></div>
  <div class="hint">Tap a card to see the recipe. Add what you fancy this Sunday.</div>
  <div class="sortrow" id="sortRow"></div>
  <div class="grid" id="cards"></div>
</div></div>

<!-- MEAL PLAN -->
<div class="view" id="v-plan"><div class="wrap" id="planWrap"></div></div>

<!-- THIS WEEK -->
<div class="view" id="v-week"><div class="wrap" id="weekWrap"></div></div>

<!-- SHOPPING -->
<div class="view" id="v-shop"><div class="wrap" id="shopWrap"></div></div>

<!-- GUIDE -->
<div class="view" id="v-guide"><div class="wrap" id="guideWrap"></div></div>

<!-- DETAIL SHEET -->
<div class="sheet" id="sheet"><div class="sheet-top"><div class="wrap">
  <button class="back" onclick="closeSheet()">&#8592;</button>
  <h2 id="shTitle"></h2>
</div></div><div class="wrap" id="shBody"></div></div>

<input type="file" accept="image/*" id="photoIn" style="display:none" onchange="onPhoto(event)">

<!-- BOTTOM NAV -->
<div class="nav">
  <button class="on" data-v="browse" onclick="go('browse')"><span class="ic">&#9635;</span>Browse</button>
  <button data-v="plan" onclick="go('plan')"><span class="ic">&#9707;</span>Plan</button>
  <button data-v="week" onclick="go('week')"><span class="ic">&#9633;</span><span id="navDot"></span>This week</button>
  <button data-v="shop" onclick="go('shop')"><span class="ic">&#9776;</span>Shop</button>
  <button data-v="guide" onclick="go('guide')"><span class="ic">&#9432;</span>Guide</button>
</div>

<script>
const RECIPES = [{"id":"honey-garlic-fried-rice","name":"Crispy Honey Garlic Chicken Fried Rice","cat":"Chicken","serves":6,"freezer":true,"prep":"45 min","blurb":"The big-batch workhorse. Sheet-pan chicken, one-tray veg + rice, sauce kept separate.","improved":false,"macros":{"kcal":850,"protein":54,"carbs":74,"fat":36},"ingredients":[{"name":"Boneless chicken thighs","unit":"g","qty":1300,"section":"Honey garlic chicken","alt":null},{"name":"Black pepper","unit":"tsp","qty":2.5,"section":"Honey garlic chicken","alt":null},{"name":"Garlic granules","unit":"tsp","qty":4,"section":"Honey garlic chicken","alt":null},{"name":"Onion powder","unit":"tsp","qty":3,"section":"Honey garlic chicken","alt":null},{"name":"Chilli flakes","unit":"tsp","qty":2,"section":"Honey garlic chicken","alt":null},{"name":"Olive oil","unit":"tsp","qty":6,"section":"Honey garlic chicken","alt":null},{"name":"Honey","unit":"g","qty":50,"section":"Honey garlic chicken","alt":null},{"name":"Light soy sauce","unit":"g","qty":30,"section":"Honey garlic chicken","alt":null},{"name":"Dark soy sauce","unit":"g","qty":25,"section":"Honey garlic chicken","alt":null},{"name":"Low-fat yogurt","unit":"g","qty":300,"section":"Creamy sriracha sauce (keep separate)","alt":null},{"name":"Light mayo","unit":"g","qty":120,"section":"Creamy sriracha sauce (keep separate)","alt":null},{"name":"Sriracha","unit":"g","qty":50,"section":"Creamy sriracha sauce (keep separate)","alt":null},{"name":"Honey","unit":"g","qty":25,"section":"Creamy sriracha sauce (keep separate)","alt":null},{"name":"Smoked paprika","unit":"tsp","qty":1.5,"section":"Creamy sriracha sauce (keep separate)","alt":null},{"name":"Frozen mixed veg (carrot, sweetcorn, green bean, pea)","unit":"g","qty":475,"section":"Toasted sesame fried rice","alt":null},{"name":"Spring onion, white part","unit":"g","qty":100,"section":"Toasted sesame fried rice","alt":"'Green onion' = spring onion"},{"name":"Sesame seeds","unit":"g","qty":40,"section":"Toasted sesame fried rice","alt":null},{"name":"White rice, uncooked","unit":"g","qty":375,"section":"Toasted sesame fried rice","alt":"~750g cooked"},{"name":"Light soy sauce","unit":"g","qty":40,"section":"Toasted sesame fried rice","alt":null},{"name":"Spring onion, green part","unit":"g","qty":50,"section":"Toasted sesame fried rice","alt":null},{"name":"Light butter","unit":"g","qty":20,"section":"Toasted sesame fried rice","alt":null}],"steps":["Cube the thighs and trim excess fat. Toss with the pepper, garlic granules, onion powder, chilli flakes, oil, honey and both soy sauces. Set aside.","Mix all the sauce ingredients until smooth. Bottle and refrigerate - it keeps the week.","Spread the chicken on a large lined tray, mist with oil and bake 20 min at 190C fan until golden and crisp at the edges.","Lift the chicken off, leaving the juices. Add the frozen veg, spring onion whites and sesame seeds to the tray, toss in the juices, spread flat and roast 15 min.","Add the cooked rice, soy, spring onion greens and light butter. Fold gently until glossy and fluffy. Return the chicken, mix, serve with the sauce."],"weighing":"Batch makes ~6 portions. Weigh cooked: aim ~125g cooked rice + ~215g cooked chicken per box. Easiest method: after cooking, weigh the total rice+veg+chicken mass, divide by 6, and portion by weight rather than by eye - the chicken shrinks ~25% on cooking so eyeballing over-serves the first two boxes.","tips":["Sauce has raw yogurt/mayo - always store it separate from the hot components or it splits on reheat.","Cook the rice the day before and chill it: cold rice fries far better and drier."]},{"id":"creamy-mushroom-pasta","name":"Creamy Mushroom Pasta","cat":"Veg / pasta","serves":4,"freezer":false,"prep":"30 min","blurb":"Cream sauce doesn't freeze well - make fresh, but a 4-portion batch keeps 2 days in the fridge.","improved":false,"macros":{"kcal":960,"protein":25,"carbs":84,"fat":55},"ingredients":[{"name":"Rigatoni","unit":"g","qty":450,"section":"","alt":null},{"name":"Shallots, chopped","unit":"","qty":4,"section":"","alt":null},{"name":"Olive oil","unit":"tbsp","qty":4,"section":"","alt":null},{"name":"Mixed mushrooms (chestnut, portobello, shiitake), sliced","unit":"g","qty":500,"section":"","alt":null},{"name":"Unsalted butter","unit":"g","qty":50,"section":"","alt":null},{"name":"Garlic, minced","unit":"cloves","qty":3,"section":"","alt":null},{"name":"Double cream","unit":"ml","qty":200,"section":"","alt":"Swap: creme fraiche, or evaporated milk for lighter"},{"name":"Parmesan, grated","unit":"g","qty":70,"section":"","alt":null},{"name":"Basil","unit":"","qty":1,"section":"","alt":null},{"name":"Onion powder","unit":"tsp","qty":0.5,"section":"","alt":"stirred into the cream"},{"name":"Dried oregano","unit":"tsp","qty":0.5,"section":"","alt":null},{"name":"Dried thyme","unit":"tsp","qty":0.5,"section":"","alt":null},{"name":"Smoked paprika","unit":"tsp","qty":0.5,"section":"","alt":null}],"steps":["Boil the rigatoni in well-salted water until al dente. Reserve a mugful of pasta water before draining.","Soften the shallots in the oil over medium heat. Add mushrooms and cook hard until they colour and their water has cooked off - don't crowd the pan.","Add butter and garlic, 1 min. Pour in the cream plus the onion powder, oregano, thyme and paprika. Simmer 2-3 min.","Off the heat stir in the parmesan, then the pasta. Loosen with pasta water to a silky (not sticky) sauce. Finish with torn basil."],"weighing":"4 even portions. Weigh the finished pan and divide by 4. If meal-prepping, slightly undercook the pasta (1 min less) so it survives reheating without going mushy.","tips":["No meat here - to make it a proper post-run recovery meal add 150-200g cooked chicken (thigh or leftover roast) or a tin of drained cannellini beans stirred in at the end for ~15g extra protein per portion.","A squeeze of lemon at the end cuts the richness."]},{"id":"lime-chicken-sandwich","name":"Lime Chicken Sandwich","cat":"Chicken","serves":2,"freezer":"partial","prep":"35 min","blurb":"Original was half-written; I've completed the build and pinned quantities for 2 sandwiches.","improved":true,"macros":{"kcal":715,"protein":48,"carbs":95,"fat":15},"ingredients":[{"name":"Chicken breast (2 x ~150g)","unit":"g","qty":300,"section":"For the chicken","alt":null},{"name":"Plain flour","unit":"g","qty":40,"section":"For the chicken","alt":null},{"name":"Egg, beaten","unit":"","qty":1,"section":"For the chicken","alt":null},{"name":"Corn flakes, crushed","unit":"g","qty":60,"section":"For the chicken","alt":null},{"name":"Avocado oil","unit":"tbsp","qty":1,"section":"Lime dressing","alt":"Swap: any neutral oil"},{"name":"Lime juice","unit":"ml","qty":120,"section":"Lime dressing","alt":null},{"name":"Honey","unit":"tbsp","qty":1,"section":"Lime dressing","alt":null},{"name":"Cumin","unit":"tsp","qty":1,"section":"Lime dressing","alt":null},{"name":"Garlic, chopped","unit":"cloves","qty":3,"section":"Lime dressing","alt":null},{"name":"Water","unit":"ml","qty":120,"section":"Lime dressing","alt":null},{"name":"Coriander, chopped","unit":"g","qty":15,"section":"Lime dressing","alt":"'Cilantro' = coriander"},{"name":"Ciabatta (2 rolls)","unit":"g","qty":180,"section":"To build","alt":null},{"name":"Cucumber, sliced","unit":"","qty":0.5,"section":"To build","alt":null},{"name":"White cabbage, shredded","unit":"g","qty":80,"section":"To build","alt":null},{"name":"Jalapeno, sliced","unit":"","qty":1,"section":"To build","alt":null},{"name":"Lime zest, onion powder, garlic powder","unit":"","qty":1,"section":"To build","alt":"for the slaw"}],"steps":["Dredge the chicken: flour, then beaten egg, then crushed corn flakes. Air-fry 18-20 min at 195C, flipping halfway, until 74C internal.","Simmer the oil, lime juice, honey, cumin, garlic and water in a small pan for 3-4 min into a loose glaze; stir in the coriander.","Toss the cabbage and cucumber with lime zest, onion powder and garlic powder for a quick slaw.","Spoon glaze over the crispy chicken, pile into toasted ciabatta with the slaw and jalapeno."],"weighing":"2 sandwiches. The breaded chicken freezes well raw or cooked; freeze the cooked cutlets flat, reheat from frozen in the air fryer 8-10 min. Assemble fresh - don't freeze built sandwiches.","tips":["Improvement I made: added a proper lime-cabbage slaw and toasting step the original skipped.","165F/74C is the food-safe internal temp for chicken breast - use a probe, breast dries out past 78C."]},{"id":"chicken-shawarma-wrap","name":"Chicken Shawarma Wrap","cat":"Chicken","serves":6,"freezer":"partial","prep":"1 hr + marinate","blurb":"Marinate ahead. Freeze the cooked spiced chicken; build wraps fresh.","improved":false,"macros":{"kcal":640,"protein":33,"carbs":32,"fat":41},"ingredients":[{"name":"Boneless chicken breast or thigh, thin sliced","unit":"g","qty":900,"section":"For the chicken (900g / 2lb)","alt":null},{"name":"Garlic, minced","unit":"tbsp","qty":1,"section":"For the chicken (900g / 2lb)","alt":null},{"name":"Mayonnaise","unit":"tbsp","qty":2,"section":"For the chicken (900g / 2lb)","alt":null},{"name":"Olive oil","unit":"tbsp","qty":1,"section":"For the chicken (900g / 2lb)","alt":null},{"name":"Smoked paprika","unit":"tbsp","qty":1,"section":"For the chicken (900g / 2lb)","alt":null},{"name":"Garlic powder, cumin, coriander, turmeric, chilli, black pepper","unit":"","qty":1,"section":"For the chicken (900g / 2lb)","alt":null},{"name":"Lemon juice","unit":"tbsp","qty":1,"section":"For the chicken (900g / 2lb)","alt":null},{"name":"Clarified butter/oil to cook","unit":"tbsp","qty":3,"section":"For the chicken (900g / 2lb)","alt":null},{"name":"Red onion, thin sliced & washed","unit":"","qty":1,"section":"Sumac onions","alt":null},{"name":"Parsley, chopped","unit":"tbsp","qty":1,"section":"Sumac onions","alt":null},{"name":"Sumac","unit":"tbsp","qty":1,"section":"Sumac onions","alt":"Obscure? Swap: 1 tbsp lemon zest + pinch of salt, or a little lemon juice"},{"name":"Lemon juice","unit":"tsp","qty":1,"section":"Sumac onions","alt":null},{"name":"Mayonnaise","unit":"g","qty":75,"section":"Garlic sauce","alt":null},{"name":"Sour cream","unit":"g","qty":115,"section":"Garlic sauce","alt":null},{"name":"Buttermilk","unit":"tbsp","qty":3,"section":"Garlic sauce","alt":"Swap: milk with a squeeze of lemon"},{"name":"Ketchup","unit":"g","qty":30,"section":"Garlic sauce","alt":null},{"name":"Hot sauce","unit":"g","qty":30,"section":"Garlic sauce","alt":null},{"name":"Garlic powder, smoked paprika","unit":"tbsp","qty":1,"section":"Garlic sauce","alt":null},{"name":"Tortilla wraps","unit":"","qty":6,"section":"To assemble","alt":null},{"name":"Cucumber, chopped","unit":"g","qty":75,"section":"To assemble","alt":null},{"name":"Tomatoes, chopped","unit":"g","qty":75,"section":"To assemble","alt":null},{"name":"Pickled cucumbers","unit":"g","qty":75,"section":"To assemble","alt":null}],"steps":["Season the chicken with salt, pepper, garlic powder, paprika, turmeric and chilli. Add mayo, fresh garlic, oil and lemon. Marinate at least 1 hr (overnight is better).","Whisk all the garlic-sauce ingredients smooth. Refrigerate.","Toss the onions with parsley, sumac, salt and lemon.","Heat clarified butter and cook the chicken in batches, 8-10 min, until charred and cooked through. Rest, then chop.","Build: warm wrap, chicken, sumac onions, cucumber, tomato, pickles, garlic sauce."],"weighing":"6 wraps' worth of filling. Portion the cooked chicken into 6 (~110g cooked each) and freeze. Sauce and onions keep 3-4 days fridge; make wraps to order.","tips":["Skip the 'spiced fries inside' if prepping - they go soggy. Serve chips on the side fresh instead.","Thigh gives juicier shawarma than breast and reheats without drying."]},{"id":"miso-chicken-spinach-rice","name":"Miso Chicken & Spinach Rice","cat":"Chicken","serves":2,"freezer":"partial","prep":"40 min","blurb":"Vivid green spinach rice under sticky grilled miso chicken.","improved":false,"macros":{"kcal":705,"protein":48,"carbs":68,"fat":26},"ingredients":[{"name":"Boneless chicken thighs","unit":"g","qty":400,"section":"","alt":null},{"name":"Red miso","unit":"g","qty":90,"section":"","alt":"Obscure? Swap: white miso, or 2 tbsp soy + 1 tsp tahini"},{"name":"Honey","unit":"g","qty":40,"section":"","alt":null},{"name":"Soy sauce","unit":"g","qty":20,"section":"","alt":null},{"name":"Lemon, juice of","unit":"","qty":0.5,"section":"","alt":null},{"name":"MSG (optional)","unit":"tsp","qty":0.5,"section":"","alt":null},{"name":"Sushi rice","unit":"g","qty":100,"section":"","alt":"Swap: any short-grain rice"},{"name":"Water","unit":"ml","qty":125,"section":"","alt":null},{"name":"Spinach","unit":"g","qty":50,"section":"","alt":null},{"name":"Garlic","unit":"cloves","qty":1,"section":"","alt":null},{"name":"Butter","unit":"g","qty":10,"section":"","alt":null},{"name":"Egg yolk, chives, lemon wedges","unit":"","qty":1,"section":"","alt":"to finish"}],"steps":["Blitz spinach, butter, water and garlic until vivid green (~1 min).","Rinse the rice until the water runs clear. Cook in the spinach water: boil, cover, low heat 12 min, then steam off the heat 12 min.","Whisk miso, honey, soy, lemon, MSG, salt and pepper. Cut each thigh into 3 strips, coat in the marinade.","Grill on high 6-8 min until charred and cooked through. Serve over the green rice with a yolk and chives."],"weighing":"Serves 2. Rice doubles/triples cleanly - but see the rice storage note: cooked rice is a 1-day-fridge ingredient, so cook rice fresh if prepping beyond 2 boxes and freeze the chicken instead.","tips":["Grilled miso chicken freezes well; the green rice is best fresh.","MSG is genuinely optional - a pinch of salt does most of the job."]},{"id":"scallion-oil-noodles","name":"Spring Onion Oil Noodles with Honey Soy Chicken","cat":"Chicken","serves":2,"freezer":false,"prep":"30 min","blurb":"Renamed from 'scallion' - it's spring onion. Fast, glossy, best eaten fresh.","improved":false,"macros":{"kcal":805,"protein":54,"carbs":68,"fat":34},"ingredients":[{"name":"Spring onions","unit":"","qty":6,"section":"","alt":"was 'scallions'"},{"name":"Avocado oil","unit":"g","qty":30,"section":"","alt":null},{"name":"Light soy","unit":"tbsp","qty":1,"section":"","alt":null},{"name":"Dark soy","unit":"tbsp","qty":2,"section":"","alt":null},{"name":"Black vinegar","unit":"tbsp","qty":1,"section":"","alt":"Obscure? Swap: balsamic + splash rice vinegar"},{"name":"Honey","unit":"g","qty":30,"section":"","alt":null},{"name":"Frozen ramen/noodles","unit":"g","qty":400,"section":"","alt":null},{"name":"5% chicken mince","unit":"g","qty":400,"section":"","alt":null},{"name":"Garlic","unit":"cloves","qty":1,"section":"","alt":null},{"name":"Shaoxing wine","unit":"tbsp","qty":1,"section":"","alt":"Obscure? Swap: dry sherry, or leave out"},{"name":"Chinese broccoli or choy sum","unit":"g","qty":200,"section":"","alt":"Swap: tenderstem broccoli, pak choi"},{"name":"Egg yolks (optional)","unit":"","qty":2,"section":"","alt":null}],"steps":["Boil salted water. Cut 4 spring onions into 2.5cm pieces, add to a pan with the avocado oil over low-medium heat until charring. Add both soys and honey, simmer 1 min, off the heat add vinegar. Set aside. Finely slice the rest.","Colour the chicken mince in a hot wok. Lower heat, add dark soy, honey and grated garlic, reduce until glossy. Deglaze with Shaoxing, set aside.","Blanch the greens 2 min. Cook the noodles, drain, add to the chicken pan with the sauce and toss - a splash of noodle water loosens it.","Bowl up, top with chicken, greens, sliced spring onion and a yolk."],"weighing":"Serves 2. Dressed noodles go claggy overnight so this is a 'cook-fresh' one; the cooked mince freezes fine on its own if you want a head start.","tips":["Not a meal-prep hero - keep it in the rotation as a fast fresh-cook night.","Egg yolk is optional but makes it silkier."]},{"id":"caramelised-onion-spaghetti","name":"Caramelised Onion & Garlic Spaghetti","cat":"Veg / pasta","serves":2,"freezer":false,"prep":"30 min","blurb":"Jammy onions, chilli crisp, a cheap and moreish store-cupboard dinner.","improved":false,"macros":{"kcal":1320,"protein":27,"carbs":92,"fat":92},"ingredients":[{"name":"Large onion, thin sliced","unit":"","qty":1,"section":"","alt":null},{"name":"Garlic, minced","unit":"cloves","qty":4,"section":"","alt":null},{"name":"Chilli crisp","unit":"tbsp","qty":2,"section":"","alt":"Swap: chilli oil + pinch chilli flakes"},{"name":"Double cream or coconut milk (room temp)","unit":"ml","qty":240,"section":"","alt":null},{"name":"Soy sauce (optional)","unit":"tbsp","qty":1,"section":"","alt":null},{"name":"Parmesan, grated","unit":"g","qty":50,"section":"","alt":null},{"name":"Pasta","unit":"g","qty":225,"section":"","alt":null},{"name":"Butter","unit":"g","qty":28,"section":"","alt":null},{"name":"Olive oil","unit":"tbsp","qty":1,"section":"","alt":null},{"name":"Paprika, garlic powder, Italian seasoning, salt, pepper","unit":"tsp","qty":1,"section":"","alt":null}],"steps":["Slice the onion thin. Melt butter with the oil over medium; cook the onions 15-20 min, stirring, until golden and jammy. Splash of water if they stick.","Meanwhile boil the pasta in salted water until al dente; save some pasta water.","Stir the garlic and seasonings into the onions, 1 min, then the chilli crisp, 1 min. Add cream, simmer, then the parmesan.","Toss the pasta through, loosening with pasta water to silky. Top with more chilli crisp."],"weighing":"Serves 2 generously. Cream sauces don't reheat brilliantly - fine next-day fridge, not for freezing.","tips":["No protein - crack in 2 eggs carbonara-style off the heat, or add 150g cooked chicken/prawns per person.","Coconut milk works and makes it dairy-free."]},{"id":"smashed-potato-salad","name":"Crispy Smashed Potato & Cucumber Salad","cat":"Side / veg","serves":4,"freezer":false,"prep":"45 min","blurb":"Sesame-mayo, chilli oil, crispy smashed spuds. A side that eats like a main with protein.","improved":false,"macros":{"kcal":465,"protein":8,"carbs":48,"fat":27},"ingredients":[{"name":"Baby potatoes","unit":"g","qty":1000,"section":"","alt":null},{"name":"Olive oil","unit":"tbsp","qty":2,"section":"","alt":null},{"name":"Spring onions","unit":"","qty":4,"section":"","alt":null},{"name":"Cucumber","unit":"","qty":1,"section":"","alt":null},{"name":"Coriander","unit":"g","qty":15,"section":"","alt":null},{"name":"Black sesame seeds","unit":"tbsp","qty":1,"section":"","alt":null},{"name":"Crispy chilli oil","unit":"tbsp","qty":2,"section":"","alt":null},{"name":"Tahini","unit":"tbsp","qty":2,"section":"Sesame mayo dressing","alt":null},{"name":"Toasted sesame oil","unit":"tbsp","qty":1,"section":"Sesame mayo dressing","alt":null},{"name":"White miso","unit":"tbsp","qty":1,"section":"Sesame mayo dressing","alt":"Swap: 1 tsp soy + pinch sugar"},{"name":"Mayo (any)","unit":"g","qty":100,"section":"Sesame mayo dressing","alt":null},{"name":"Lime","unit":"","qty":1,"section":"Sesame mayo dressing","alt":null},{"name":"Water","unit":"tbsp","qty":3,"section":"Sesame mayo dressing","alt":null}],"steps":["Simmer the potatoes until tender, drain and steam-dry, then smash flat and roast or air-fry until crisp.","Whisk the dressing ingredients smooth.","Deseed and half-moon the cucumber, slice spring onions, pick coriander.","Toss the crispy potatoes with the veg and dressing; finish with sesame and chilli oil."],"weighing":"Side for 4, or main for 2. Best fresh - crispy potatoes go soft in the fridge, so if prepping keep components separate and re-crisp the spuds in the air fryer.","tips":["Easy protein to make it a meal: 2 lamb chops per person, or 150g chicken thigh, or a tin of chickpeas roasted alongside the potatoes.","This is the one salad here I'd not batch-prep - crisp potato doesn't survive."]},{"id":"crispy-chicken-tacos","name":"Crispy Chicken Tacos","cat":"Chicken","serves":5,"freezer":"partial","prep":"45 min","blurb":"Cheese-crisped tortillas, spiced chicken, pico and a punchy sauce.","improved":false,"macros":{"kcal":1030,"protein":53,"carbs":61,"fat":62},"ingredients":[{"name":"Boneless chicken thighs, small dice","unit":"g","qty":900,"section":"For the chicken (900g / 2lb)","alt":null},{"name":"Smoked paprika, chilli powder, garlic powder, black pepper","unit":"tsp","qty":1,"section":"For the chicken (900g / 2lb)","alt":null},{"name":"Garlic, minced","unit":"tbsp","qty":2,"section":"For the chicken (900g / 2lb)","alt":null},{"name":"Oil","unit":"tbsp","qty":3,"section":"For the chicken (900g / 2lb)","alt":null},{"name":"Onion, finely chopped & washed","unit":"","qty":1,"section":"Pico de gallo","alt":null},{"name":"Tomato, diced","unit":"","qty":1,"section":"Pico de gallo","alt":null},{"name":"Coriander, chopped","unit":"tbsp","qty":2,"section":"Pico de gallo","alt":null},{"name":"Lime juice","unit":"tbsp","qty":1,"section":"Pico de gallo","alt":null},{"name":"Mayonnaise","unit":"g","qty":110,"section":"Spicy taco sauce","alt":null},{"name":"Sour cream","unit":"g","qty":115,"section":"Spicy taco sauce","alt":null},{"name":"Hot sauce","unit":"tbsp","qty":3,"section":"Spicy taco sauce","alt":null},{"name":"Smoked paprika, garlic powder, lime juice","unit":"tbsp","qty":1,"section":"Spicy taco sauce","alt":null},{"name":"Mini tortillas","unit":"","qty":18,"section":"To assemble","alt":null},{"name":"Mozzarella","unit":"g","qty":220,"section":"To assemble","alt":null},{"name":"Oil for frying","unit":"tbsp","qty":1,"section":"To assemble","alt":null}],"steps":["Mix the chicken with salt, paprika, chilli powder, garlic powder and pepper.","Fry the minced garlic 1 min, add chicken and cook until crisp and cooked through. Set aside.","Combine pico ingredients; chill. Whisk the sauce ingredients, loosen with a little water.","In a pan, lay mozzarella, let it crisp, top with chicken and a tortilla, fold and crisp both sides.","Serve with pico and the spicy sauce."],"weighin n smash each one flat with the base of a mug.","Toss the smashed potatoes with the oil and salt. Roast at 220C for 30-35 minutes until the edges are shattered and dark gold.","While the potatoes roast, get a pan properly hot and cook the steak fast, about 3 minutes a side for medium-rare. Rest for 8 minutes, then slice against the grain.","Smash the cucumber with the flat of a knife blade, tear into rough chunks, salt it and leave for 10 minutes, then squeeze out the water by hand. This is what keeps the box from turning watery - don't skip it.","Whisk the miso, sesame oil, rice vinegar, soy sauce, honey and grated garlic into a dressing. Toss the potatoes, steak and cucumber with the dressing, finish with chilli oil, sesame seeds, spring onion and coriander."],"weighing":"Serves 2 as a full bowl. Prep components separately and keep un-dressed - potatoes, steak and drained cucumber each keep 3 days in the fridge as parts. Dress and assemble on the day you eat it; once dressed, the cucumber will weep and go soft within a few hours.","tips":["Salting and draining the cucumber is the one step that actually matters here - skip it and the dressing pools with cucumber water by day two.","Steak reheats badly. If you're eating this as leftovers, keep it cold and sliced rather than microwaving it - a warm steak salad, not a hot one."]},{"id":"charred-lime-gochujang-salmon","name":"Charred Lime Gochujang Salmon Bites","cat":"Fish","serves":4,"freezer":"partial","improved":false,"prep":"30 min","blurb":"Grilled salmon cubes with charred lime, a gochujang yogurt sauce, and a quick cucumber-tomato salad over rice.","link":"https://www.instagram.com/reel/Db88kwBS1Qr/","macros":{"kcal":844,"protein":45,"carbs":67,"fat":45},"ingredients":[{"name":"Salmon, cut into 4cm cubes","unit":"g","qty":680,"section":"Salmon","alt":"was 1.5lb"},{"name":"Avocado oil","unit":"tbsp","qty":1,"section":"Salmon","alt":null},{"name":"Sea salt","unit":"tsp","qty":1,"section":"Salmon","alt":null},{"nam const BY_ID = Object.fromEntries(RECIPES.map(r=>[r.id,r]));
let state = { week:{}, checked:{}, plan:{}, photos:{}, links:{}, sort:'default' };
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
function blankSlot(){ return {dish:null, wife:false}; }
function ensurePlan(){
  DAYS.forEach(d=>{
    if(!state.plan[d]) state.plan[d] = {lunch:blankSlot(), dinner:blankSlot()};
    ['lunch','dinner'].forEach(w=>{ if(!state.plan[d][w]) state.plan[d][w]=blankSlot(); });
  });
}

/* ---------- persistence ---------- */
const LS_KEY = 'mealprep_state';
let lastSaveOK = true;
async function save(){
  const blob = JSON.stringify(state);
  try{ localStorage.setItem(LS_KEY, blob); lastSaveOK = true; }
  catch(e){ lastSaveOK = false; }
  try{ if(window.storage) await window.storage.set(LS_KEY, blob, false); }catch(e){}
  return lastSaveOK;
}
function applyState(raw){
  if(!raw) return false;
  try{
    const s = JSON.parse(raw);
    state.week = s.week||{}; state.checked = s.checked||{}; state.plan = s.plan||{};
    state.photos = s.photos||{}; state.links = s.links||{}; state.sort = s.sort||'default';
    return true;
  }catch(e){ return false; }
}
async function load(){
  let ok = false;
  try{ ok = applyState(localStorage.getItem(LS_KEY)); }catch(e){}
  if(!ok){
    try{
      const r = await window.storage.get(LS_KEY, false);
      if(r && r.value) applyState(r.value);
    }catch(e){}
  }
  ensurePlan();
}

/* ---------- helpers ---------- */
const CATS = ['All','Chicken','Fish','Beef','Veg','Pasta','Freezer'];
let filter='All';
function matchFilter(r){
  if(filter==='All') return true;
  if(filter==='Freezer') return r.freezer===true || r.freezer==='partial';
  if(filter==='Pasta') return /pasta/i.test(r.cat);
  if(filter==='Veg') return /veg/i.test(r.cat) && !/pasta/i.test(r.cat) || r.cat==='Veg';
  return r.cat.toLowerCase().includes(filter.toLowerCase());
}
function freezeBadge(f){
  if(f===true) return '<span class="badge b-freeze">FREEZES</span>';
  if(f==='partial') return '<span class="badge b-part">PART FREEZE</span>';
  return '<span class="badge b-fresh">EAT FRESH</span>';
}
function macroRow(m){
  return `<div class="macros">
    <div class="kcal"><div class="v">${m.kcal}</div><div class="k">kcal</div></div>
    <div><div class="v">${m.protein}</div><div class="k">P</div></div>
    <div><div class="v">${m.carbs}</div><div class="k">C</div></div>
    <div><div class="v">${m.fat}</div><div class="k">F</div></div></div>`;
}

/* ---------- browse ---------- */
function renderChips(){
  chips.innerHTML = CATS.map(c=>`<button class="chip ${c===filter?'on':''}" onclick="setFilter('${c}')">${c}</button>`).join('');
}
function setFilter(c){ filter=c; renderChips(); renderCards(); }
function renderCards(){
  const list = sortList(RECIPES.filter(matchFilter));
  cards.innerHTML = list.map(r=>{
    const inWeek = state.week[r.id]!=null;
    return `<div class="card" onclick="openSheet('${r.id}')">
      <div class="thumb">${visual(r.id)}
        <span class="${densClass(r)}">${pDens(r).toFixed(1)}g P / 100 kcal</span>
        ${linkFor(r.id)?`<button class="linkchip" onclick="openLink('${r.id}',event)">watch</button>`:''}
      </div>
      ${freezeBadge(r.freezer)}
      <div class="cat">${r.cat}${r.improved?' &middot; upgraded':''}</div>
      <h3>${r.name}</h3>
      <div class="meta"><span>&#9201; <b>${r.prep}</b></span><span>serves <b>${r.serves}</b></span></div>
      ${macroRow(r.macros)}
      <div class="addrow" onclick="event.stopPropagation()">
        <button class="addbtn ${inWeek?'in':''}" onclick="toggleWeek('${r.id}',event)">
          ${inWeek?'&#10003; In this week':'+ Add to this week'}</button>
      </div>
    </div>`;
  }).join('');
}

/* ---------- detail sheet ---------- */
function ingLine(it){
  let q = it.qty;
  let unit = it.unit||'';
  let disp='';
  if(q===0 || q===''){ disp=''; }
  else if(unit===''){ disp = fmtNum(q); }
  else { disp = fmtNum(q)+' '+unit; }
  const alt = it.alt?`<span class="alt">${it.alt}</span>`:'';
  return `<div class="ing"><span class="nm">${it.name}${alt}</span><span class="q">${disp}</span></div>`;
}
function fmtNum(n){
  if(Math.abs(n-Math.round(n))<0.01) return String(Math.round(n));
  return String(Math.round(n*4)/4);
}
function storageFor(r){
  const rice = /rice|risotto/i.test(r.name) || r.ingredients.some(i=>/\brice\b/i.test(i.name));
  let fridge = '2 days';
  if(rice) fridge = '1 day (rice)';
  let freezer = r.freezer===true?'2-3 months':(r.freezer==='partial'?'components only':'do not freeze');
  return {fridge,freezer,rice};
}
function openSheet(id){
  const r = BY_ID[id];
  shTitle.textContent = r.name;
  const st = storageFor(r);
  // group ingredients by section
  let ingHTML='', lastSec=null;
  r.ingredients.forEach(it=>{
    if(it.section && it.section!==lastSec){ ingHTML+=`<div class="ing"><span class="subhead">${it.section}</span><span></span></div>`; lastSec=it.section; }
    ingHTML+=ingLine(it);
  });
  const inWeek = state.week[id]!=null;
  const p = state.week[id]||r.serves;
  const hasPhoto = !!state.photos[id];
  const hasLink  = !!linkFor(id);
  shBody.innerHTML = `
    <div class="hero">${visual(id)}
      <span class="${densClass(r)}">${pDens(r).toFixed(1)}g P / 100 kcal</span>
    </div>
    <div class="heroacts">
      <button onclick="pickPhoto('${id}',event)">${hasPhoto?'Change photo':'Add photo'}</button>
      ${hasPhoto?`<button onclick="removePhoto('${id}',event)">Remove</button>`:''}
      <button class="${hasLink?'go':''}" onclick="${hasLink?`openLink('${id}',event)`:`setLink('${id}',event)`}">
        ${hasLink?'Watch video':'Add link'}</button>
      ${hasLink?`<button onclick="setLink('${id}',event)">Edit</button>`:''}
    </div>
    <div class="sect">
      <div class="cat" style="font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--olive);font-weight:700">${r.cat}${r.improved?' &middot; upgraded by me':''}</div>
      <p style="color:var(--muted);font-size:14px;margin:6px 0 12px">${r.blurb}</p>
      ${macroRow(r.macros)}
      <div style="font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;margin-top:5px">per portion &middot; batch serves ${r.serves}</div>
    </div>
    <div class="sect"><h4>Ingredients</h4>${ingHTML}</div>
    <div class="sect"><h4>Method</h4><ol class="steps">${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div>
    <div class="sect"><h4>Portioning &amp; weighing</h4><div class="callout">${r.weighing}</div></div>
    <div class="sect"><h4>Keeps for</h4>
      <div class="store">
        <div><div class="lab">Fridge</div><div class="val">${st.fridge}</div></div>
        <div><div class="lab">Freezer</div><div class="val">${st.freezer}</div></div>
        <div><div class="lab">Reheat</div><div class="val">Once, hot</div></div>
      </div>
      ${st.rice?`<div class="callout rust" style="margin-top:8px"><b>Rice rule.</b> Cool within 1 hr, fridge no more than 1 day, reheat once until steaming. Bacillus cereus toxins survive reheating, so the storage gap is the risk, not the reheat. (FSA)</div>`:''}
    </div>
    <div class="sect"><h4>Notes</h4>${r.tips.map(t=>`<div class="tip">${t}</div>`).join('')}</div>
    <div class="sect">
      <div class="addrow">
        <button class="addbtn ${inWeek?'in':''}" id="shAdd" onclick="toggleWeek('${id}',event,true)">
          ${inWeek?'&#10003; In this week':'+ Add to this week'}</button>
        <div class="stepper">
          <button onclick="stepPortion('${id}',-1)">&minus;</button>
          <span class="n" id="shN">${p}</span>
          <button onclick="stepPortion('${id}',1)">+</button>
          <span class="lbl">portions</span>
        </div>
      </div>
    </div>
    <div style="height:24px"></div>`;
  sheet.classList.add('open');
}
function closeSheet(){ sheet.classList.remove('open'); document.body.style.overflow=''; }

/* ---------- week management ---------- */
function toggleWeek(id,ev,fromSheet){
  if(ev) ev.stopPropagation();
  const r=BY_ID[id];
  if(state.week[id]!=null){ delete state.week[id]; }
  else { state.week[id]=r.serves; }
  save(); syncAll();
  if(fromSheet){ const inW=state.week[id]!=null;
    const b=document.getElementById('shAdd');
    b.className='addbtn '+(inW?'in':''); b.innerHTML=inW?'&#10003; In this week':'+ Add to this week'; }
}
function stepPortion(id,d){
  if(state.week[id]==null){ state.week[id]=BY_ID[id].serves; }
  state.week[id]=Math.max(1,state.week[id]+d);

function wkStep(id,d){ state.week[id]=Math.max(1,(state.week[id]||BY_ID[id].serves)+d); save(); syncAll(); }

function buildPlan(ids){
  const rs=ids.map(id=>BY_ID[id]);
  const oven=rs.filter(r=>/bake|roast|air-fry|oven|grill/i.test(r.steps.join(' '))).map(r=>r.name);
  const rice=rs.filter(r=>storageFor(r).rice).map(r=>r.name);
  const fresh=rs.filter(r=>r.freezer===false).map(r=>r.name);
  const sauces=rs.filter(r=>/sauce|dressing|yogurt|mayo/i.test(r.steps.join(' ')+r.ingredients.map(i=>i.name).join(' '))).map(r=>r.name);
  let steps=[];
  steps.push(`Mix every cold sauce/dressing first and bottle them - they keep the week and clear your bench.`);
  if(rice.length) steps.push(`Get rice on early, then <b>spread it thin to cool fast</b> (within 1 hr) for: ${rice.join(', ')}. Rice is the tightest-timed component.`);
  if(oven.length) steps.push(`Batch the oven/air-fryer work back to back at ~190-200C: ${oven.join(', ')}.`);
  if(fresh.length) steps.push(`Leave these as fresh-cook nights, don&rsquo;t box them: ${fresh.join(', ')}.`);
  steps.push(`Cool everything, then portion by weight (divide total by servings) before it hits the fridge/freezer - eyeballing over-serves the first boxes.`);
  steps.push(`Label freezer boxes with the date. Anything not frozen: eat within 2 days.`);
  return `<div class="plan"><h4>Sunday prep game plan</h4>
    ${steps.map((s,i)=>`<div class="step"><span class="n">${i+1}</span>${s}</div>`).join('')}</div>`;
}

];
function aisleOf(name){ for(const[a,re]of AISLES){ if(re.test(name)) return a; } return 'Other'; }
/* ---------- shopping: canonicalise + unit-aware merge ---------- */
// Weight and volume units convert exactly regardless of ingredient (no density
// guessing). Weight never merges with volume, and count items never merge with
// either - that would require assuming a density I don't actually know.
const UNIT_W = {g:1, kg:1000};
const UNIT_V = {ml:1, l:1000, tsp:4.92892, tbsp:14.7868, cup:240, fl_oz:29.5735};
function unitClass(u){ if(UNIT_W[u]!=null) return 'w'; if(UNIT_V[u]!=null) return 'v'; return 'c'; }
function toBase(qty,u){ if(UNIT_W[u]!=null) return qty*UNIT_W[u]; if(UNIT_V[u]!=null) return qty*UNIT_V[u]; return qty; }
function baseUnit(cls){ return cls==='w' ? 'g' : (cls==='v' ? 'ml' : ''); }

// Strip prep-instruction clauses that don't change what you'd buy at the shop.
const STRIP_TRAIL = /,\s*(chopped|sliced|thin(?:ly)?\s*sliced|fine(?:ly)?\s*chopped|small dice|small cubes|diced|minced|grated|crushed|deseeded|beaten|white part|green part)\b.*$/i;
const STRIP_LEAD  = /^(large|small|baby)\s+/i;

// Real duplicate products found across the recipe set - merged deliberately.
// Anything NOT listed here (dark soy, buttermilk, cheddar variants, garlic
// powder vs fresh garlic) is left alone on purpose: they're different items
// to buy, even though the names look similar.
const CANON = [
  [/^light butter$|^unsalted butter$|^butter$/i, 'Butter'],
  [/^light mayo$|^mayonnaise$|^mayo$/i, 'Mayonnaise'],
  [/^light soy$|^light soy sauce$|^soy sauce$/i, 'Soy sauce'],
  [/^dark soy$|^dark soy sauce$/i, 'Dark soy sauce'],
  [/^sesame oil$|^toasted sesame oil$/i, 'Toasted sesame oil'],
  [/^low-fat yogurt$|^plain greek yogurt$|^0% greek yogurt$/i, 'Greek yogurt'],
  [/^sour cream$|^light sour cream$/i, 'Sour cream'],
  [/^spring onion$|^spring onions$/i, 'Spring onions'],
  [/^garlic$/i, 'Garlic'],
  [/^coriander$/i, 'Coriander'],
  [/^cucumber$/i, 'Cucumber'],
  [/^parsley$/i, 'Parsley'],
  [/^onion$/i, 'Onion'],
  [/^red onion$/i, 'Red onion'],
  [/^tomatoes$|^tomato$|^diced tomatoes$/i, 'Tomatoes'],
  [/^lime, juice of$|^lime$/i, 'Lime'],
];
function canonicalise(rawName){
  let n = rawName.replace(/\(.*?\)/g,'').trim();
  n = n.replace(STRIP_TRAIL,'').trim();
  n = n.replace(STRIP_LEAD,'').trim();
  for(const [re,out] of CANON){ if(re.test(n)) return out; }
  return n;
}
function normKey(name,unit){
  const canon = canonicalise(name);
  const cls = unitClass(unit);
  return canon.toLowerCase()+'|'+cls;
}
function roundQty(n,unit){
  if(unit==='g'||unit==='ml'){ return n>=100?Math.round(n/10)*10:Math.round(n/5)*5||Math.round(n); }
  if(unit==='tsp'||unit==='tbsp'){ return Math.round(n*2)/2; }
  return Math.round(n*2)/2;
}
function renderShop(){
  const ids=Object.keys(state.week);
  if(!ids.length){ shopWrap.innerHTML=`<div class="empty"><h3>Empty basket</h3>
    <p>Pick your recipes in Browse and the shopping list builds itself, scaled to your portions.</p></div>`; return; }
  const agg={};
  ids.forEach(id=>{ const r=BY_ID[id]; const scale=state.week[id]/r.serves;
    r.ingredients.forEach(it=>{
      if(it.qty===0||it.qty==='') { // count-less / "to taste" -> list once, no qty
        const k=normKey(it.name,''); if(!agg[k])agg[k]={name:canonicalise(it.name),unit:'',qty:0,noqty:true};
        return; }
      const k=normKey(it.name,it.unit);
      const cls=unitClass(it.unit), u=baseUnit(cls);
      if(!agg[k])agg[k]={name:canonicalise(it.name),unit:u,qty:0,sources:new Set()};
      agg[k].qty+=toBase(it.qty,it.unit)*scale;
      agg[k].sources.add(r.name);
    });
  });
  // group by aisle
  const byAisle={};
  Object.entries(agg).forEach(([k,v])=>{ const a=aisleOf(v.name); (byAisle[a]=byAisle[a]||[]).push({k,...v}); });
  const order=['Meat &amp; fish','Fruit &amp; veg','Dairy &amp; chilled','Frozen','Bakery','Herbs, spices &amp; sauces','Other'];
  const total=Object.keys(agg).length;
  const done=Object.values(agg).filter((v,i)=>state.checked[Object.keys(agg)[i]]).length;
  let html=`<div class="shophead"><span class="n">${total} items &middot; ${ids.length} recipes</span>
    <button class="copy" onclick="copyList()">Copy list</button></div>`;
  order.forEach(a=>{ if(!byAisle[a])return;
    byAisle[a].sort((x,y)=>x.name.localeCompare(y.name));
    html+=`<div class="aisle">${a}</div>`;
    byAisle[a].forEach(v=>{
      const dn=state.checked[v.k]?'done':'';
      const q=v.noqty?'':(roundQty(v.qty,v.unit)+(v.unit?' '+v.unit:''));
      const merged=v.sources && v.sources.size>1;
      html+=`<div class="sitem ${dn}" onclick="toggleCheck('${v.k.replace(/'/g,"\\'")}')">
        <div class="box">${dn?'&#10003;':''}</div>
        <span class="nm">${v.name}${merged?`<span class="merged">from ${v.sources.size} recipes</span>`:''}</span><span class="q">${q}</span></div>`;
    });
  });
  html+=`<div class="hint" style="margin-top:16px">Quantities are scaled to the portions you set. Round up on the shop floor - a little spare never hurts.</div>`;
  shopWrap.innerHTML=html;
  shopWrap._agg=agg;
}
function toggleCheck(k){ state.checked[k]=!state.checked[k]; save(); renderShop(); }
function copyList(){
  const agg=shopWrap._agg||{};
  const byAisle={};
  Object.entries(agg).forEach(([k,v])=>{ const a=aisleOf(v.name).replace(/&amp;/g,'&'); (byAisle[a]=byAisle[a]||[]).push(v); });
  let txt='SHOPPING LIST\n\n';
  Object.entries(byAisle).forEach(([a,items])=>{ txt+=a.toUpperCase()+'\n';
    items.forEach(v=>{ const q=v.noqty?'':' - '+roundQty(v.qty,v.unit)+(v.unit?' '+v.unit:''); txt+='  '+v.name+q+'\n'; });
    txt+='\n'; });
  navigator.clipboard.writeText(txt).then(()=>{
    const b=document.querySelector('.copy'); if(b){const o=b.textContent;b.textContent='Copied';setTimeout(()=>b.textContent=o,1200);}
  }).catch(()=>{});
}

function rnd(seed){
  let h=1779033703^seed.length;
  for(let i=0;i<seed.length;i++){ h=Math.imul(h^seed.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  return function(){ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909);
                     h^=h>>>16; return (h>>>0)/4294967296; };
}

    height="${h.toFixed(1)}" rx="${(Math.min(w,h)/2.4).toFixed(1)}" fill="${fill}"
    transform="rotate(${rot.toFixed(0)} ${cx.toFixed(1)} ${cy.toFixed(1)})"${op?` opacity="${op}"`:''}/>`;
}

      o += `<path d="M${cx-26*sc} ${cy+2*sc} q ${26*sc} ${-20*sc} ${52*sc} 0 z" fill="${base}"/>`;
      o += `<rect x="${cx-25*sc}" y="${cy+1*sc}" width="${50*sc}" height="${7*sc}" rx="${3*sc}" fill="${main}"/>`;
      o += `<rect x="${cx-24*sc}" y="${cy+7*sc}" width="${48*sc}" height="${4.5*sc}" rx="${2*sc}" fill="${accent}"/>`;
      o += `<rect x="${cx-25*sc}" y="${cy+11*sc}" width="${50*sc}" height="${3.5*sc}" rx="${1.8*sc}" fill="${herb}"/>`;
      o += `<path d="M${cx-26*sc} ${cy+14*sc} h ${52*sc} q ${2*sc} ${9*sc} ${-6*sc} ${9*sc} h ${-40*sc} q ${-8*sc} 0 ${-6*sc} ${-9*sc} z" fill="${base}"/>`;
      return o;
    };
    g += draw(52,36,.72);
    g += draw(96,50,1);

  } else if(style==='tray'){
    g += `<rect x="20" y="16" width="120" height="64" rx="9" fill="${vessel}"/>`;
    g += `<rect x="24" y="20" width="112" height="56" rx="6" fill="rgba(32,36,29,.045)"/>`;
    for(let i=0;i<14;i++){
      const x=32+R()*96, y=27+R()*42;
      g += blob(x,y,13+R()*9,9+R()*5,R()*180, R()>.42?main:accent);
    }
    for(let i=0;i<12;i++){
      g += `<circle cx="${(30+R()*100).toFixed(1)}" cy="${(25+R()*46).toFixed(1)}"
             r="${(1.3+R()*1.4).toFixed(1)}" fill="${herb}"/>`;
    }
    g += `<rect x="20" y="16" width="120" height="64" rx="9" fill="none" stroke="rgba(32,36,29,.12)" stroke-width="1.4"/>`;

  } else { // pie
    g += `<rect x="22" y="18" width="116" height="60" rx="11" fill="${vessel}"/>`;
    let d=`M28 68 `;
    for(let i=0;i<11;i++){ d += `Q ${28+i*10.5+5} ${28+ (i%2?6:-4) + R()*4}, ${28+(i+1)*10.5} ${34+R()*3} `; }
    d += `L 132 68 Z`;
    g += `<path d="${d}" fill="${base}"/>`;
    for(let i=0;i<13;i++){
      g += `<ellipse cx="${(32+R()*96).toFixed(1)}" cy="${(36+R()*26).toFixed(1)}"
             rx="${(2.4+R()*3.4).toFixed(1)}" ry="${(1.6+R()*2).toFixed(1)}" fill="${main}" opacity=".55"/>`;
    }
    for(let i=0;i<7;i++){
      g += `<circle cx="${(34+R()*92).toFixed(1)}" cy="${(38+R()*22).toFixed(1)}"
             r="${(1.2+R()*1.2).toFixed(1)}" fill="${herb}"/>`;
    }
    g += `<rect x="22" y="18" width="116" height="60" rx="11" fill="none" stroke="rgba(32,36,29,.12)" stroke-width="1.4"/>`;
  }
  return `<svg viewBox="0 0 160 96" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">${g}</svg>`;
}
function visual(id){
  const ph = state.photos[id];
  return ph ? `<img src="${ph}" alt="">` : dishArt(id);
}

/* ---------- protein density ---------- */
function pDens(r){ return r.macros.protein / r.macros.kcal * 100; }
function densClass(r){ return pDens(r) >= 6.3 ? 'pdens hi' : 'pdens'; }

/* ---------- photos ---------- */
let pendingPhoto = null;
function pickPhoto(id, ev){ if(ev) ev.stopPropagation(); pendingPhoto = id; document.getElementById('photoIn').click(); }
function removePhoto(id, ev){
  if(ev) ev.stopPropagation();
  delete state.photos[id]; save(); renderCards();
  if(sheet.classList.contains('open')) openSheet(id);
}
function onPhoto(e){
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!f || !pendingPhoto) return;
  const id = pendingPhoto;
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = async () => {
      const max = 460;
      let w = img.width, h = img.height;
      const sc = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * sc); h = Math.round(h * sc);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      const prev = state.photos[id];
      state.photos[id] = c.toDataURL('image/jpeg', 0.68);
      const ok = await save();
      if(!ok){
        if(prev) state.photos[id] = prev; else delete state.photos[id];
        await save();
        alert('Storage is full. Remove a photo or two and try again.');
      }
      renderCards();
      if(sheet.classList.contains('open')) openSheet(id);
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(f);
}

/* ---------- source links ---------- */
function linkFor(id){ return state.links[id] || (BY_ID[id] && BY_ID[id].link) || null; }
function setLink(id, ev){
  if(ev) ev.stopPropagation();
  const cur = linkFor(id) || '';
  const v = prompt('Paste the Instagram (or any) link for this recipe:', cur);
  if(v === null) return;
  const t = v.trim();
  if(t) state.links[id] = t; else delete state.links[id];
  save(); renderCards();
  if(sheet.classList.contains('open')) openSheet(id);
}
function openLink(id, ev){
  if(ev) ev.stopPropagation();
  const u = linkFor(id);
  if(u) window.open(u, '_blank');
}

/* ---------- sorting ---------- */
const SORTS = [['default','Curated'],['protein','Protein density'],['kcal','Lightest'],['az','A to Z']];
function renderSort(){
  document.getElementById('sortRow').innerHTML = SORTS.map(([k,l])=>
    `<button class="${state.sort===k?'on':''}" onclick="setSort('${k}')">${l}</button>`).join('');
}
function setSort(k){ state.sort=k; save(); renderSort(); renderCards(); }
function sortList(list){
  const l = list.slice();
  if(state.sort==='protein') l.sort((a,b)=>pDens(b)-pDens(a));
  else if(state.sort==='kcal') l.sort((a,b)=>a.macros.kcal-b.macros.kcal);
  else if(state.sort==='az') l.sort((a,b)=>a.name.localeCompare(b.name));
  return l;
}

/* ---------- meal plan ---------- */
function plannedPortions(id){
  let n = 0;
  DAYS.forEach(d=>['lunch','dinner'].forEach(w=>{
    const sl = state.plan[d][w];
    if(sl.dish === id) n += (sl.wife ? 2 : 1);
  }));
  return n;
}
function renderPlan(){
  ensurePlan();
  let h = '';
  DAYS.forEach(d=>{
    h += `<div class="day"><div class="day-h">${d}</div>`;
    ['lunch','dinner'].forEach(w=>{
      const sl = state.plan[d][w];
      const r  = sl.dish ? BY_ID[sl.dish] : null;
      h += `<div class="slot">
        <div class="slot-r" onclick="pickSlot('${d}','${w}')">
          <span class="slot-t">${w==='lunch'?'Lunch':'Dinner'}</span>
          <span class="slot-n${r?'':' none'}">${r?esc(r.name):'Tap to choose'}</span>
          ${r?`<button class="slot-x" onclick="event.stopPropagation();clearSlot('${d}','${w}')">&times;</button>`
             :'<span class="slot-x">&rsaquo;</span>'}
        </div>`;
      if(r){
        h += `<div class="wifebar" onclick="toggleWife('${d}','${w}')">
          <span class="sw${sl.wife?' on':''}"></span><span>Wife eating too</span>
          <span class="portpill">${sl.wife?2:1} portion${sl.wife?'s':''}</span>
        </div>`;
      }
      h += '</div>';
    });
    h += '</div>';
  });
  let filled = 0;
  DAYS.forEach(d=>['lunch','dinner'].forEach(w=>{ if(state.plan[d][w].dish) filled++; }));
  h += `<div class="planhint">${filled} of 14 slots planned. Choosing a dish here also ticks it into
    <b>This week</b>, so it flows through to your shopping list. Dinners assume your wife eats too by default.</div>`;
  h += '<div style="height:24px"></div>';
  document.getElementById('planWrap').innerHTML = h;
}
function pickSlot(day, which){
  const cur = state.plan[day][which].dish;
  const inWeek = RECIPES.filter(r=>state.week[r.id]!=null);
  const rest   = RECIPES.filter(r=>state.week[r.id]==null);
  let h = `<div class="pickhead">${day} &middot; ${which}</div>`;
  const rows = list => list.map(r=>`
    <div class="pickrow" onclick="assignSlot('${day}','${which}','${r.id}')">
      <span class="nm">${esc(r.name)}${cur===r.id?' &#10003;':''}</span>
      <span class="mt">${r.macros.kcal} kcal &middot; ${r.macros.protein}g P</span>
    </div>`).join('');
  if(inWeek.length){
    h += `<div class="pickhead">Ticked for this week</div>
          <div class="day">${rows(inWeek)}</div>`;
  }
  h += `<div class="pickhead">${inWeek.length?'All other recipes':'All recipes'}</div>
        <div class="day">${rows(rest)}</div><div style="height:30px"></div>`;
  document.getElementById('shTitle').textContent = 'Choose a dish';
  document.getElementById('shBody').innerHTML = h;
  sheet.classList.add('open');
}
function assignSlot(day, which, id){
  const sl = state.plan[day][which];
  const wasEmpty = !sl.dish;
  sl.dish = id;
  if(wasEmpty) sl.wife = (which === 'dinner');
  if(state.week[id] == null) state.week[id] = BY_ID[id].serves;   // keep shopping list in step
  save(); closeSheet(); renderPlan(); syncAll();
}
function clearSlot(day, which){
  state.plan[day][which] = blankSlot();
  save(); renderPlan(); syncAll();
}
function toggleWife(day, which){
  const sl = state.plan[day][which];
  sl.wife = !sl.wife;
  save(); renderPlan();
  if(document.getElementById('v-week').classList.contains('on')) renderWeek();
}
function matchPortions(id){
  const n = plannedPortions(id);
  if(n > 0){ state.week[id] = n; save(); syncAll(); }
}

/* ---------- nav / sync ---------- */
function go(v){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  document.getElementById('v-'+v).classList.add('on');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(v==='plan')renderPlan(); if(v==='week')renderWeek(); if(v==='shop')renderShop(); if(v==='guide')renderGuide();
  window.scrollTo(0,0);
}
function syncAll(){
  const n=Object.keys(state.week).length;
  wkPill.textContent = n?`${n} this week`:'0 this week';
  navDot.className = n?'dot':'';
  renderCards();
  if(document.getElementById('v-week').classList.contains('on'))renderWeek();
  if(document.getElementById('v-shop').classList.contains('on'))renderShop();
  if(document.getElementById('v-plan').classList.contains('on'))renderPlan();
}

/* ---------- boot ---------- */
(async function(){
  await load();
  renderChips(); renderSort(); renderCards(); syncAll();
})();
</script>
