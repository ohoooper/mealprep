<title>Prep Station</title>
<style>
:root{
  --bg:#F3F3EF; --surface:#FFFFFF; --surface2:#EAEAE3; --line:#DEDED6;
  --ink:#14171A; --ink2:#4B5057; --ink3:#5C6169;
  --acc:#14804A; --acc-ink:#FFFFFF; --acc-text:#0E6B3D; --acc-soft:#DDF3E6; --acc-soft-ink:#0B4F2C;
  --pop:#D8F36A; --pop-ink:#16200A;
  --btn:#14171A; --btn-ink:#FFFFFF;
  --danger:#B3261E; --danger-soft:#FBE4E1; --danger-solid:#C42B1C;
  --blue-soft:#DCEBFA; --blue-ink:#0F3D6B; --amber-soft:#FCEFC7; --amber-ink:#5E4100; --red-soft:#FBE3DC; --red-ink:#7A1F0E;
  --swoff:#9EA3AA; --tabbg:rgba(255,255,255,.92);
  --shadow:0 1px 2px rgba(20,23,26,.06),0 10px 28px rgba(20,23,26,.07);
  --tab-h:58px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E1012; --surface:#181B1F; --surface2:#23272C; --line:#2D3238;
    --ink:#F3F4F5; --ink2:#C1C6CD; --ink3:#A5ABB3;
    --acc:#4ADE8B; --acc-ink:#06150C; --acc-text:#4ADE8B; --acc-soft:#16372A; --acc-soft-ink:#9BEFC0;
    --pop:#D8F36A; --pop-ink:#16200A;
    --btn:#F3F4F5; --btn-ink:#14171A;
    --danger:#FF9088; --danger-soft:#3C1B19; --danger-solid:#C42B1C;
    --blue-soft:#17304A; --blue-ink:#B3D5F7; --amber-soft:#3B2E0A; --amber-ink:#F3D27A; --red-soft:#3C1C15; --red-ink:#F7B8A8;
    --swoff:#5A6068; --tabbg:rgba(24,27,31,.92);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color:var(--ink)}
html.locked,html.locked body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:var(--ink);background:transparent;border:0;margin:0;padding:0;border-radius:0}
button{cursor:pointer;text-align:inherit;-webkit-appearance:none;appearance:none}
a{color:var(--acc-text);font-weight:600}
h1,h2,h3,h4,p{color:var(--ink)}

/* ---------- views ---------- */
.view{display:none;padding:0 16px calc(var(--tab-h) + var(--safe-b) + 96px);max-width:760px;margin:0 auto;background:var(--bg);color:var(--ink)}
.view.on{display:block}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:calc(var(--safe-t) + 18px) 0 12px;background:var(--bg)}
.hd h1{margin:0;font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.9px;color:var(--ink)}
.hd p{margin:6px 0 0;font-size:15px;color:var(--ink2)}
.iconbtn{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 15px;border-radius:999px;background:var(--surface);color:var(--ink);font-weight:650;font-size:14px;box-shadow:inset 0 0 0 1px var(--line);flex:none}
.iconbtn.round{width:42px;padding:0;justify-content:center}

/* ---------- search + chips ---------- */
.searchbar{position:sticky;top:0;z-index:6;background:var(--bg);margin:0 -16px;padding:6px 16px 10px}
.sbox{display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink3);border-radius:15px;padding:0 14px;min-height:50px;box-shadow:inset 0 0 0 1px var(--line)}
.sbox input{flex:1;min-width:0;height:50px;font-size:16px;color:var(--ink);background:transparent;outline:none;-webkit-appearance:none}
.sbox input::placeholder{color:var(--ink3);opacity:1}
.sbox input::-webkit-search-cancel-button{-webkit-appearance:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 14px;scrollbar-width:none;background:var(--bg)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:999px;background:var(--surface);color:var(--ink);font-weight:650;font-size:14px;box-shadow:inset 0 0 0 1px var(--line)}
.chip.on{background:var(--btn);color:var(--btn-ink);box-shadow:none}

/* ---------- recipe cards ---------- */
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.card{background:var(--surface);color:var(--ink);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.985)}
.media{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--surface2)}
.media.hero{border-radius:24px;aspect-ratio:16/11;margin:14px 0 14px}
.cover{position:absolute;inset:0}
.cover i,.cover u{position:absolute;border-radius:50%;display:block;text-decoration:none}
.cover i{width:74%;aspect-ratio:1;right:-14%;top:-22%;background:rgba(255,255,255,.26)}
.cover u{width:46%;aspect-ratio:1;left:-8%;bottom:-24%;background:rgba(255,255,255,.2)}
.c-chicken{background:linear-gradient(140deg,#F4C26B,#E0833A)}
.c-beef{background:linear-gradient(140deg,#E8917D,#B2483A)}
.c-fish{background:linear-gradient(140deg,#8FCDE2,#3E8DB4)}
.c-veg{background:linear-gradient(140deg,#AAD88C,#4C9856)}
.c-pasta{background:linear-gradient(140deg,#F2D88A,#D49837)}
.media img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s;background:var(--surface2)}
.media img.ph.in{opacity:1}
.tag{position:absolute;left:12px;top:12px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.2px}
.t-blue{background:var(--blue-soft);color:var(--blue-ink)}
.t-amber{background:var(--amber-soft);color:var(--amber-ink)}
.t-red{background:var(--red-soft);color:var(--red-ink)}
.watch{position:absolute;right:12px;top:12px;display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 10px;border-radius:999px;background:#14171A;color:#FFFFFF;font-size:12px;font-weight:700;min-height:30px}
.pchip{position:absolute;left:12px;bottom:12px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;background:#14171A;color:#FFFFFF}
.pchip.hi{background:var(--pop);color:var(--pop-ink)}
.fab{position:absolute;right:12px;bottom:12px;width:48px;height:48px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.fab.on{background:var(--acc);color:var(--acc-ink)}
.cb{padding:14px 18px 18px;background:var(--surface);color:var(--ink)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink2)}
.cb h3{margin:4px 0 8px;font-size:21px;line-height:1.2;font-weight:760;letter-spacing:-.3px;color:var(--ink)}
.stats{font-size:14px;color:var(--ink2)}
.stats b{color:var(--ink);font-weight:700}

/* ---------- generic ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 18px;border-radius:16px;font-weight:680;font-size:16px;background:var(--btn);color:var(--btn-ink);text-align:center}
.btn.acc{background:var(--acc);color:var(--acc-ink)}
.btn.soft{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{min-height:44px;font-size:14px;width:auto;padding:0 16px}
.btn:active,.iconbtn:active,.chip:active{transform:scale(.97)}
.stack{display:flex;flex-direction:column;gap:10px}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.sh{margin:28px 0 10px;font-size:13px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--ink2)}
.empty{text-align:center;padding:56px 24px;color:var(--ink2);background:var(--bg)}
.empty h3{margin:0 0 8px;color:var(--ink);font-size:21px}
.empty p{margin:0;color:var(--ink2)}
.empty .btn{margin:20px auto 0;width:auto;display:inline-flex}
.stepper{display:inline-flex;align-items:center;background:var(--surface2);color:var(--ink);border-radius:14px}
.stepper button{width:44px;height:44px;display:grid;place-items:center;font-size:22px;font-weight:600;color:var(--ink);background:transparent}
.stepper span{min-width:30px;text-align:center;font-weight:750;font-variant-numeric:tabular-nums;color:var(--ink)}
.sw{position:relative;display:block;width:48px;height:29px;border-radius:15px;background:var(--swoff);flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw.on{background:var(--acc)}
.sw.on::after{transform:translateX(19px)}
.link{color:var(--ink2);font-size:13px;font-weight:650;padding:10px 6px;text-decoration:underline;background:transparent}

/* ---------- plan ---------- */
.day{background:var(--surface);color:var(--ink);border-radius:22px;margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
.day-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px 6px}
.day-h b{font-size:18px;font-weight:750;color:var(--ink)}
.today{margin-left:8px;padding:3px 9px;border-radius:999px;background:var(--pop);color:var(--pop-ink);font-size:11px;font-weight:750;letter-spacing:.4px;text-transform:uppercase;vertical-align:2px}
.day-t{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.slot{padding:4px 10px 8px;background:var(--surface);color:var(--ink)}
.slot+.slot{border-top:1px solid var(--line)}
.slot-main{display:flex;align-items:center;gap:12px;width:100%;padding:8px 8px;border-radius:16px;min-height:68px;color:var(--ink);background:transparent}
.slot-main:active{background:var(--surface2)}
.slot-tag{width:50px;flex:none;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink2)}
.thumb{position:relative;width:54px;height:54px;border-radius:15px;overflow:hidden;flex:none;background:var(--surface2)}
.thumb.empty{background:transparent;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;color:var(--ink3)}
.thumb img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.thumb img.ph.in{opacity:1}
.slot-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.slot-txt b{font-weight:680;line-height:1.25;color:var(--ink)}
.slot-txt small{font-size:13px;color:var(--ink2)}
.slot-empty{flex:1;color:var(--ink2);font-weight:600}
.chev{color:var(--ink3);flex:none}
.slot-sub{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 8px 4px 10px}
.wf{display:inline-flex;align-items:center;gap:12px;min-height:44px;color:var(--ink);font-size:14px;font-weight:650;background:transparent;white-space:nowrap}
.wf em{font-style:normal;color:var(--ink2);font-weight:550;white-space:nowrap}

/* ---------- week ---------- */
.sum{background:var(--surface);color:var(--ink);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.sum h3{margin:0;font-size:18px;color:var(--ink)}
.sum p{margin:4px 0 14px;font-size:14px;color:var(--ink2)}
.mt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mt div{background:var(--surface2);color:var(--ink);border-radius:14px;padding:11px 4px;text-align:center}
.mt b{display:block;font-size:20px;font-weight:800;letter-spacing:-.3px;color:var(--ink);font-variant-numeric:tabular-nums}
.mt span{display:block;font-size:11px;font-weight:650;letter-spacing:.5px;text-transform:uppercase;color:var(--ink2)}
.wk{display:grid;grid-template-columns:62px 1fr;gap:10px 14px;align-items:center;background:var(--surface);color:var(--ink);border-radius:22px;padding:14px;margin-top:10px;box-shadow:var(--shadow)}
.wk .thumb{width:62px;height:62px;border-radius:16px}
.wk-i{flex:1;min-width:0;cursor:pointer}
.wk-i b{display:block;font-weight:700;line-height:1.25;color:var(--ink)}
.wk-i small{display:block;font-size:13px;color:var(--ink2);margin-top:2px}
.wk-i .need{color:var(--acc-text);font-weight:650}
.match{margin-left:8px;padding:3px 10px;border-radius:999px;background:var(--acc);color:var(--acc-ink);font-size:12px;font-weight:700;min-height:26px}
.wk-r{grid-column:1/-1;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
.prep{background:var(--surface);color:var(--ink);border-radius:22px;padding:4px 18px;box-shadow:var(--shadow);margin:14px 0 4px}
.prep summary{list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:58px;font-weight:720;font-size:17px;cursor:pointer;color:var(--ink)}
.prep summary::-webkit-details-marker{display:none}
.prep summary svg{transition:transform .2s;color:var(--ink2)}
.prep[open] summary svg{transform:rotate(180deg)}
.pstep{display:flex;gap:12px;padding:8px 0 12px;color:var(--ink);font-size:15px}
.pstep i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:750}

/* ---------- shop ---------- */
.prog{background:var(--surface);color:var(--ink);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.prog-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;color:var(--ink)}
.prog-t b{font-size:22px;font-weight:800;letter-spacing:-.4px}
.prog-t span{font-size:14px;color:var(--ink2)}
.bar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:5px;transition:width .3s}
.addrow{display:flex;gap:10px;margin:14px 0 2px}
.addrow input{flex:1;min-width:0;min-height:52px;border-radius:16px;padding:0 16px;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);outline:none;font-size:16px}
.addrow input::placeholder{color:var(--ink3);opacity:1}
.addrow .btn{width:auto;min-width:84px}
.aisle{display:flex;justify-content:space-between;align-items:baseline;margin:24px 6px 8px;font-size:13px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--ink2)}
.list{background:var(--surface);color:var(--ink);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:13px;padding:12px 4px 12px 16px;min-height:58px;color:var(--ink);cursor:pointer;background:var(--surface)}
.item+.item{border-top:1px solid var(--line)}
.item:active{background:var(--surface2)}
.tick{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink3);flex:none;display:grid;place-items:center;color:var(--acc-ink);background:transparent}
.tick.on{background:var(--acc);box-shadow:none}
.it-main{flex:1;min-width:0}
.it-name{display:block;font-weight:640;color:var(--ink)}
.it-for{display:block;font-size:12.5px;line-height:1.3;color:var(--ink2);margin-top:2px}
.it-q{font-variant-numeric:tabular-nums;font-weight:720;white-space:nowrap;color:var(--ink);font-size:15px}
.it-more{width:44px;height:48px;display:grid;place-items:center;color:var(--ink2);flex:none;background:transparent}
.item.done .it-name{text-decoration:line-through;color:var(--ink3)}
.item.done .it-q,.item.done .it-for{color:var(--ink3)}
.fold{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:0 18px;border-radius:20px;background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow);margin-top:20px}
.fold small{color:var(--ink2);font-weight:550;font-size:14px}
.hint{font-size:13px;color:var(--ink2);margin:18px 6px 0;line-height:1.5}

/* ---------- guide ---------- */
.gcard{background:var(--surface);color:var(--ink);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.gcard h4{margin:0 0 10px;font-size:18px;color:var(--ink)}
.gcard p{margin:0 0 10px;color:var(--ink);font-size:15px}
.grow{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;color:var(--ink)}
.grow b{font-weight:720;text-align:right;color:var(--ink);white-space:nowrap;flex:none}
.src{font-size:13px;color:var(--ink2)}
.credits{margin:0;padding:0;list-style:none;font-size:14px;color:var(--ink)}
.credits li{padding:8px 0;border-bottom:1px solid var(--line);color:var(--ink)}

/* ---------- sheet (detail + picker) ---------- */
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);visibility:hidden;transition:transform .34s cubic-bezier(.32,.72,0,1),visibility 0s .34s}
.sheet.open{transform:none;visibility:visible;transition-delay:0s}
.sh-top{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:calc(var(--safe-t) + 10px) 16px 10px;background:var(--bg);color:var(--ink);border-bottom:1px solid var(--line)}
.sh-top .x{width:42px;height:42px;border-radius:50%;background:var(--surface2);color:var(--ink);display:grid;place-items:center;flex:none}
.sh-top h2{margin:0;font-size:17px;font-weight:720;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.sh-in{max-width:680px;margin:0 auto;padding:0 16px calc(var(--safe-b) + 48px);background:var(--bg);color:var(--ink)}
.credit{font-size:12.5px;color:var(--ink2);margin:-4px 2px 14px}
.cap{font-size:13.5px;color:var(--ink2);margin:-4px 2px 14px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.mchip{padding:7px 13px;border-radius:999px;background:var(--surface2);color:var(--ink);font-size:13px;font-weight:650}
.pc{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);color:var(--ink);border-radius:20px;padding:12px 12px 12px 18px;margin-bottom:10px;box-shadow:var(--shadow)}
.pc b{display:block;font-size:16px;color:var(--ink)}
.pc small{color:var(--ink2);font-size:13px}
.ig{font-size:13px;font-weight:700;color:var(--acc-text);margin:18px 0 2px;letter-spacing:.3px}
.ing{display:flex;gap:14px;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.ing .n{color:var(--ink)}
.ing .alt{display:block;font-size:13px;color:var(--ink2);margin-top:1px}
.ing .q{font-variant-numeric:tabular-nums;font-weight:720;white-space:nowrap;color:var(--ink)}
.steps{counter-reset:s;list-style:none;margin:0;padding:0}
.steps li{counter-increment:s;display:flex;gap:14px;padding:11px 0;color:var(--ink);line-height:1.5}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;font-size:13px;font-weight:750}
.note{background:var(--acc-soft);color:var(--acc-soft-ink);padding:15px 17px;border-radius:18px;font-size:15px;line-height:1.5}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st div{background:var(--surface);color:var(--ink);border-radius:16px;padding:13px 10px;text-align:center;box-shadow:var(--shadow)}
.st span{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink2)}
.st b{display:block;margin-top:4px;font-size:15px;color:var(--ink)}
.tips{margin:0;padding:0 0 0 20px;color:var(--ink)}
.tips li{margin:0 0 8px;line-height:1.5;color:var(--ink)}
.prow{display:flex;align-items:center;gap:14px;width:100%;padding:11px 8px;border-radius:16px;min-height:72px;background:var(--surface);color:var(--ink);margin-bottom:8px;box-shadow:var(--shadow)}
.prow .thumb{width:56px;height:56px}
.prow b{display:block;font-weight:680;line-height:1.25;color:var(--ink)}
.prow small{display:block;font-size:13px;color:var(--ink2)}
.prow .ok{color:var(--acc-text);flex:none}
.psearch{margin:14px 0 6px}
.vposter{display:flex;align-items:center;gap:16px;width:100%;min-height:92px;padding:0 20px;border-radius:22px;background:#14171A;color:#FFFFFF;text-align:left;font-weight:700;font-size:16px}
.vposter .vp{flex:none;width:52px;height:52px;border-radius:50%;background:#D8F36A;color:#16200A;display:grid;place-items:center}
.vposter small{display:block;font-weight:500;font-size:13px;color:#C9CDD2;margin-top:2px}
.embed{border-radius:22px;overflow:hidden;background:#FFFFFF;box-shadow:var(--shadow)}
.embed iframe{display:block;width:100%;height:740px;border:0;background:#FFFFFF}

/* ---------- dialog ---------- */
#scrim{position:fixed;inset:0;z-index:75;background:rgba(10,12,14,.55);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
#scrim.on{opacity:1;visibility:visible;transition-delay:0s}
.dialog{position:fixed;left:0;right:0;bottom:0;z-index:80;max-width:640px;margin:0 auto;background:var(--surface);color:var(--ink);border-radius:28px 28px 0 0;padding:10px 18px calc(var(--safe-b) + 18px);transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.32,.72,0,1),visibility 0s .3s;box-shadow:0 -12px 44px rgba(0,0,0,.28)}
.dialog.open{transform:none;visibility:visible;transition-delay:0s}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.dialog h3{margin:4px 0 6px;font-size:21px;font-weight:760;color:var(--ink)}
.dialog p{margin:0 0 16px;color:var(--ink2);font-size:15px;line-height:1.5}
.dialog textarea{width:100%;min-height:150px;border-radius:14px;padding:12px;background:var(--surface2);color:var(--ink);font-size:13px;font-family:ui-monospace,Menlo,monospace;margin-bottom:12px;outline:none;resize:vertical}

/* ---------- toast, pill, tabs ---------- */
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tab-h) + var(--safe-b) + 14px);z-index:70;display:flex;justify-content:center;pointer-events:none}
#toast .t{pointer-events:auto;display:flex;align-items:center;gap:16px;background:#1B1F23;color:#F3F4F5;padding:12px 14px 12px 18px;border-radius:18px;box-shadow:0 10px 32px rgba(0,0,0,.4);font-size:15px;font-weight:560;max-width:560px;transform:translateY(24px);opacity:0;transition:transform .25s,opacity .25s}
#toast .t.on{transform:none;opacity:1}
#toast .t button{color:#D8F36A;font-weight:760;padding:6px 6px;min-height:40px;background:transparent}
body.has-pill #toast{bottom:calc(var(--tab-h) + var(--safe-b) + 80px)}
#pill{position:fixed;left:16px;right:16px;bottom:calc(var(--tab-h) + var(--safe-b) + 14px);z-index:35;display:none;justify-content:center}
#pill.on{display:flex}
#pill button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;max-width:560px;min-height:56px;padding:0 8px 0 22px;border-radius:999px;background:#1B1F23;color:#F3F4F5;box-shadow:0 10px 30px rgba(0,0,0,.32);font-weight:660}
#pill .go{display:grid;place-items:center;min-height:42px;padding:0 18px;border-radius:999px;background:#D8F36A;color:#16200A;font-weight:760;font-size:14px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;height:calc(var(--tab-h) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--tabbg);border-top:1px solid var(--line);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px)}
.tab{position:relative;flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:650;color:var(--ink3);background:transparent}
.tab.on{color:var(--acc-text)}
.tbadge{position:absolute;top:5px;left:calc(50% + 6px);min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--danger-solid);color:#FFFFFF;font-size:11px;font-weight:750;display:grid;place-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
(function(){
'use strict';
var RECIPES=[{"id":"honey-garlic-fried-rice","name":"Crispy Honey Garlic Chicken Fried Rice","cat":"Chicken","serves":6,"freezer":true,"prep":"45 min","blurb":"The big-batch workhorse. Sheet-pan chicken, one-tray veg + rice, sauce kept separate.","improved":false,"macros":{"kcal":850,"protein":54,"carbs":74,"fat":36},"ingredients":[{"name":"Boneless chicken thighs","unit":"g","qty":1300,"section":"Honey garlic chicken","alt":null},{"name":"Black pepper","unit":"tsp","qty":2.5,"section":"Honey garlic chicken","alt":null},{"name":"Garlic granules","unit":"tsp","qty":4,"section":"Honey garlic chicken","alt":null},{"name":"Onion powder","unit":"tsp","qty":3,"section":"Honey garlic chicken","alt":null},{"name":"Chilli flakes","unit":"tsp","qty":2,"section":"Honey garlic chicken","alt":null},{"name":"Olive oil","unit":"tsp","qty":6,"section":"Honey garlic chicken","alt":null},{"name":"Honey","unit":"g","qty":50,"section":"Honey garlic chicken","alt":null},{"name":"Light soy sauce","unit":"g","qty":30,"section":"Honey garlic chicken","alt":null},{"name":"Dark soy sauce","unit":"g","qty":25,"section":"Honey garlic chicken","alt":null},{"name":"Low-fat yogurt","unit":"g","qty":300,"section":"Creamy sriracha sauce (keep separate)","alt":null},{"name":"Light mayo","unit":"g","qty":120,"section":"Creamy sriracha sauce (keep separate)","alt":null},{"name":"Sriracha","unit":"g","qty":50,"section":"Creamy sriracha sauce (keep separate)","alt":null},{"name":"Honey","unit":"g","qty":25,"section":"Creamy sriracha sauce (keep separate)","alt":null},{"name":"Smoked paprika","unit":"tsp","qty":1.5,"section":"Creamy sriracha sauce (keep separate)","alt":null},{"name":"Frozen mixed veg (carrot, sweetcorn, green bean, pea)","unit":"g","qty":475,"section":"Toasted sesame fried rice","alt":null},{"name":"Spring onion, white part","unit":"g","qty":100,"section":"Toasted sesame fried rice","alt":"'Green onion' = spring onion"},{"name":"Sesame seeds","unit":"g","qty":40,"section":"Toasted sesame fried rice","alt":null},{"name":"White rice, uncooked","unit":"g","qty":375,"section":"Toasted sesame fried rice","alt":"~750g cooked"},{"name":"Light soy sauce","unit":"g","qty":40,"section":"Toasted sesame fried rice","alt":null},{"name":"Spring onion, green part","unit":"g","qty":50,"section":"Toasted sesame fried rice","alt":null},{"name":"Light butter","unit":"g","qty":20,"section":"Toasted sesame fried rice","alt":null}],"steps":["Cube the thighs and trim excess fat. Toss with the pepper, garlic granules, onion powder, chilli flakes, oil, honey and both soy sauces. Set aside.","Mix all the sauce ingredients until smooth. Bottle and refrigerate - it keeps the week.","Spread the chicken on a large lined tray, mist with oil and bake 20 min at 190C fan until golden and crisp at the edges.","Lift the chicken off, leaving the juices. Add the frozen veg, spring onion whites and sesame seeds to the tray, toss in the juices, spread flat and roast 15 min.","Add the cooked rice, soy, spring onion greens and light butter. Fold gently until glossy and fluffy. Return the chicken, mix, serve with the sauce."],"weighing":"Batch makes ~6 portions. Weigh cooked: aim ~125g cooked rice + ~215g cooked chicken per box. Easiest method: after cooking, weigh the total rice+veg+chicken mass, divide by 6, and portion by weight rather than by eye - the chicken shrinks ~25% on cooking so eyeballing over-serves the first two boxes.","tips":["Sauce has raw yogurt/mayo - always store it separate from the hot components or it splits on reheat.","Cook the rice the day before and chill it: cold rice fries far better and drier."]},{"id":"creamy-mushroom-pasta","name":"Creamy Mushroom Pasta","cat":"Veg / pasta","serves":4,"freezer":false,"prep":"30 min","blurb":"Cream sauce doesn't freeze well - make fresh, but a 4-portion batch keeps 2 days in the fridge.","improved":false,"macros":{"kcal":960,"protein":25,"carbs":84,"fat":55},"ingredients":[{"name":"Rigatoni","unit":"g","qty":450,"section":"","alt":null},{"name":"Shallots, chopped","unit":"","qty":4,"section":"","alt":null},{"name":"Olive oil","unit":"tbsp","qty":4,"section":"","alt":null},{"name":"Mixed mushrooms (chestnut, portobello, shiitake), sliced","unit":"g","qty":500,"section":"","alt":null},{"name":"Unsalted butter","unit":"g","qty":50,"section":"","alt":null},{"name":"Garlic, minced","unit":"cloves","qty":3,"section":"","alt":null},{"name":"Double cream","unit":"ml","qty":200,"section":"","alt":"Swap: creme fraiche, or evaporated milk for lighter"},{"name":"Parmesan, grated","unit":"g","qty":70,"section":"","alt":null},{"name":"Basil","unit":"","qty":1,"section":"","alt":null},{"name":"Onion powder","unit":"tsp","qty":0.5,"section":"","alt":"stirred into the cream"},{"name":"Dried oregano","unit":"tsp","qty":0.5,"section":"","alt":null},{"name":"Dried thyme","unit":"tsp","qty":0.5,"section":"","alt":null},{"name":"Smoked paprika","unit":"tsp","qty":0.5,"section":"","alt":null}],"steps":["Boil the rigatoni in well-salted water until al dente. Reserve a mugful of pasta water before draining.","Soften the shallots in the oil over medium heat. Add mushrooms and cook hard until they colour and their water has cooked off - don't crowd the pan.","Add butter and garlic, 1 min. Pour in the cream plus the onion powder, oregano, thyme and paprika. Simmer 2-3 min.","Off the heat stir in the parmesan, then the pasta. Loosen with pasta water to a silky (not sticky) sauce. Finish with torn basil."],"weighing":"4 even portions. Weigh the finished pan and divide by 4. If meal-prepping, slightly undercook the pasta (1 min less) so it survives reheating without going mushy.","tips":["No meat here - to make it a proper post-run recovery meal add 150-200g cooked chicken (thigh or leftover roast) or a tin of drained cannellini beans stirred in at the end for ~15g extra protein per portion.","A squeeze of lemon at the end cuts the richness."]},{"id":"lime-chicken-sandwich","name":"Lime Chicken Sandwich","cat":"Chicken","serves":2,"freezer":"partial","prep":"35 min","blurb":"Original was half-written; I've completed the build and pinned quantities for 2 sandwiches.","improved":true,"macros":{"kcal":715,"protein":48,"carbs":95,"fat":15},"ingredients":[{"name":"Chicken breast (2 x ~150g)","unit":"g","qty":300,"section":"For the chicken","alt":null},{"name":"Plain flour","unit":"g","qty":40,"section":"For the chicken","alt":null},{"name":"Egg, beaten","unit":"","qty":1,"section":"For the chicken","alt":null},{"name":"Corn flakes, crushed","unit":"g","qty":60,"section":"For the chicken","alt":null},{"name":"Avocado oil","unit":"tbsp","qty":1,"section":"Lime dressing","alt":"Swap: any neutral oil"},{"name":"Lime juice","unit":"ml","qty":120,"section":"Lime dressing","alt":null},{"name":"Honey","unit":"tbsp","qty":1,"section":"Lime dressing","alt":null},{"name":"Cumin","unit":"tsp","qty":1,"section":"Lime dressing","alt":null},{"name":"Garlic, chopped","unit":"cloves","qty":3,"section":"Lime dressing","alt":null},{"name":"Water","unit":"ml","qty":120,"section":"Lime dressing","alt":null},{"name":"Coriander, chopped","unit":"g","qty":15,"section":"Lime dressing","alt":"'Cilantro' = coriander"},{"name":"Ciabatta (2 rolls)","unit":"g","qty":180,"section":"To build","alt":null},{"name":"Cucumber, sliced","unit":"","qty":0.5,"section":"To build","alt":null},{"name":"White cabbage, shredded","unit":"g","qty":80,"section":"To build","alt":null},{"name":"Jalapeno, sliced","unit":"","qty":1,"section":"To build","alt":null},{"name":"Lime zest, onion powder, garlic powder","unit":"","qty":1,"section":"To build","alt":"for the slaw"}],"steps":["Dredge the chicken: flour, then beaten egg, then crushed corn flakes. Air-fry 18-20 min at 195C, flipping halfway, until 74C internal.","Simmer the oil, lime juice, honey, cumin, garlic and water in a small pan for 3-4 min into a loose glaze; stir in the coriander.","Toss the cabbage and cucumber with lime zest, onion powder and garlic powder for a quick  150g cooked chicken + ~170g potato per box. Chicken + potatoes freeze well; keep salad and sauce out of the freezer.","tips":["This is your highest-protein prep here (~55g/portion) and the most freezer-robust - lean on it.","The creamy sauce is calorie-dense; a 30g spoon per box is plenty."],"link":"https://www.instagram.com/reel/DELVrTfoaFT/"},{"id":"cheeseburger-hot-pockets","name":"Cheeseburger Hot Pockets","cat":"Beef","serves":6,"freezer":true,"prep":"45 min","blurb":"2-ingredient yogurt dough, seasoned beef, sealed and baked. Freezer gold.","improved":false,"macros":{"kcal":355,"protein":24,"carbs":51,"fat":5},"ingredients":[{"name":"Plain flour","unit":"g","qty":400,"section":"","alt":null},{"name":"0% Greek yogurt","unit":"g","qty":420,"section":"","alt":null},{"name":"Beef mince 7% fat","unit":"g","qty":170,"section":"","alt":"See note: I'd double this to 340g"},{"name":"Coarse salt","unit":"tsp","qty":1,"section":"","alt":null},{"name":"Onion powder, garlic powder, pepper, oregano, cumin, chilli powder","unit":"tsp","qty":0.5,"section":"","alt":null},{"name":"Worcestershire sauce","unit":"","qty":1,"section":"","alt":"a splash"},{"name":"Diced tomatoes","unit":"tbsp","qty":2,"section":"","alt":null},{"name":"Light mayo","unit":"g","qty":30,"section":"","alt":null},{"name":"2% cheddar","unit":"g","qty":40,"section":"","alt":null},{"name":"Fat-free cheddar","unit":"g","qty":40,"section":"","alt":null},{"name":"Pickled jalapenos, diced","unit":"g","qty":20,"section":"","alt":null}],"steps":["Mix flour and yogurt into a dough; add flour if sticky. Rest briefly.","Brown the beef with the salt, onion/garlic powder, pepper, oregano, cumin, chilli and Worcestershire; stir in the diced tomato.","Roll dough portions thin, thinning the edges for sealing.","Fill with beef, mayo, both cheddars, jalapenos; fold and crimp to seal.","Bake ~20-25 min at 200C until golden. (An egg wash helps colour.)"],"weighing":"Makes ~6 pockets. Freeze after baking; reheat from frozen in the oven ~20 min or air fryer. Great grab-and-go.","tips":["Honest note: 170g beef across 6 pockets is thin - I'd double the beef to ~340g for a proper filling and more protein.","0% Greek yogurt dough is genuinely high-protein - lean, not just a gimmick."],"link":"https://www.instagram.com/reel/CzT9FHUr1p8/"},{"id":"steak-smashed-potato-salad","name":"Crispy Smashed Potato & Steak Salad","cat":"Beef","serves":2,"freezer":false,"improved":false,"prep":"50 min","blurb":"Charred smashed potatoes, rested steak and salted cucumber in a miso-sesame dressing. Prep the parts separately, toss together on the day.","macros":{"kcal":620,"protein":39,"carbs":52,"fat":30},"ingredients":[{"name":"New potatoes","unit":"g","qty":500,"section":"Bowl","alt":null},{"name":"Rump or sirloin steak","unit":"g","qty":300,"section":"Bowl","alt":null},{"name":"Cucumber","unit":"g","qty":300,"section":"Bowl","alt":null},{"name":"Olive oil","unit":"ml","qty":15,"section":"Bowl","alt":null},{"name":"Spring onions","unit":"","qty":3,"section":"Bowl","alt":null},{"name":"Coriander","unit":"g","qty":10,"section":"Bowl","alt":null},{"name":"Toasted sesame seeds","unit":"tbsp","qty":1,"section":"Bowl","alt":null},{"name":"White miso","unit":"g","qty":20,"section":"Dressing","alt":"No white miso? Use red miso, or 1 tsp tahini + a splash more soy"},{"name":"Toasted sesame oil","unit":"ml","qty":10,"section":"Dressing","alt":null},{"name":"Rice vinegar","unit":"ml","qty":15,"section":"Dressing","alt":"Sub white wine vinegar or lime juice"},{"name":"Soy sauce","unit":"tbsp","qty":1,"section":"Dressing","alt":null},{"name":"Honey","unit":"tsp","qty":1,"section":"Dressing","alt":null},{"name":"Garlic","unit":"cloves","qty":1,"section":"Dressing","alt":null},{"name":"Chilli oil","unit":"tsp","qty":1,"section":"Dressing","alt":"To taste - start with 1 tsp"}],"steps":["Boil the potatoes whole for 20 minutes until a knife slides in with no resistance. Drain well and let them steam-dry for a minute, then smash each one flat with the base of a mug.","Toss the smashed potatoes with the oil and salt. Roast at 220C for 30-35 minutes until the edges are shattered and dark gold.","While the potatoes roast, get a pan properly hot and cook the steak fast, about 3 minutes a side for medium-rare. Rest for 8 minutes, then slice against the grain.","Smash the cucumber with the flat of a knife blade, tear into rough chunks, salt it and leave for 10 minutes, then squeeze out the water by hand. This is what keeps the box from turning watery - don't skip it.","Whisk the miso, sesame oil, rice vinegar, soy sauce, honey and grated garlic into a dressing. Toss the potatoes, steak and cucumber with the dressing, finish with chilli oil, sesame seeds, spring onion and coriander."],"weighing":"Serves 2 as a full bowl. Prep components separately and keep un-dressed - potatoes, steak and drained cucumber each keep 3 days in the fridge as parts. Dress and assemble on the day you eat it; once dressed, the cucumber will weep and go soft within a few hours.","tips":["Salting and draining the cucumber is the one step that actually matters here - skip it and the dressing pools with cucumber water by day two.","Steak reheats badly. If you're eating this as leftovers, keep it cold and sliced rather than microwaving it - a warm steak salad, not a hot one."]},{"id":"charred-lime-gochujang-salmon","name":"Charred Lime Gochujang Salmon Bites","cat":"Fish","serves":4,"freezer":"partial","improved":false,"prep":"30 min","blurb":"Grilled salmon cubes with charred lime, a gochujang yogurt sauce, and a quick cucumber-tomato salad over rice.","link":"https://www.instagram.com/reel/Db88kwBS1Qr/","macros":{"kcal":844,"protein":45,"carbs":67,"fat":45},"ingredients":[{"name":"Salmon, cut into 4cm cubes","unit":"g","qty":680,"section":"Salmon","alt":"was 1.5lb"},{"name":"Avocado oil","unit":"tbsp","qty":1,"section":"Salmon","alt":null},{"name":"Sea salt","unit":"tsp","qty":1,"section":"Salmon","alt":null},{"name":" nd add the lime halves cut-side up, drizzled with a little oil.","Grill for about 8 minutes, until the salmon is browned at the edges and just cooked through, and the limes are charred.","While the salmon grills, toss the cucumber with the rice vinegar, cherry tomatoes, sesame oil, black sesame seeds and sea salt.","Squeeze the juice from the charred limes. Whisk together the Greek yogurt, avocado oil, gochujang, honey, 1 tbsp of the charred lime juice and sea salt.","Toss the warm salmon through half the gochujang yogurt sauce.","Build bowls with jasmine rice, the sauced salmon, the cucumber-tomato salad and half an avocado each. Finish with the rest of the gochujang yogurt, sesame seeds and spring onion."],"weighing":"Serves 4. The salmon and rice keep well as parts for 2 days in the fridge - dress the salad and slice the avocado fresh each time, both go soft and brown if prepped ahead.","tips":["The lime halves need to actually touch the tray to char properly - don't perch them on top of the salmon.","Charring the lime first, then juicing it, is what gives the yogurt sauce its smoky edge - a fresh squeeze alone tastes flatter."]},{"id":"zero-carb-chicken-nuggets","name":"Zero Carb Chicken Nuggets","cat":"Chicken","serves":2,"freezer":true,"improved":false,"prep":"30 min","blurb":"Chicken breast blended with egg and parmesan, no breadcrumbs needed. Genuinely carb-free and freezes well.","link":"https://www.instagram.com/reel/Db6KQsHOV3W/","macros":{"kcal":235,"protein":35,"carbs":0,"fat":10},"ingredients":[{"name":"Egg","unit":"","qty":1,"section":"","alt":null},{"name":"Chicken breast","unit":"","qty":1,"section":"","alt":null},{"name":"Parmesan, grated","unit":"g","qty":50,"section":"","alt":"was 1/2 cup"},{"name":"Salt","unit":"tsp","qty":1,"section":"","alt":null},{"name":"Black pepper","unit":"tsp","qty":1,"section":"","alt":null},{"name":"Garlic powder","unit":"tsp","qty":1,"section":"","alt":null},{"name":"Onion powder","unit":"tsp","qty":1,"section":"","alt":null},{"name":"Paprika","unit":"tsp","qty":1,"section":"","alt":null}],"steps":["Heat the oven to 200C (a standard bake temperature for nuggets - the original recipe just said '200 degrees' with no unit, so this is my best reading; if your air fryer defaults to Fahrenheit, that's roughly 400F).","Roughly chop the chicken breast, then blitz it in a food processor with the egg, salt, pepper, garlic powder, onion powder and paprika until it forms a rough paste.","Pulse in the grated parmesan until just combined.","Shape into about 10 nuggets using two spoons or damp hands, and place on a lined baking tray.","Bake for 20 minutes, turning halfway, until firm and golden.","Alternatively, air fry at 200C for 10-12 minutes, turning halfway."],"weighing":"Makes about 10 nuggets, serving 2 as a main with a side, or more as a snack. Freezes well raw or cooked - if freezing raw, open-freeze on a tray first so they don't stick together, then bag them up.","tips":["The mix is quite wet - wetting your hands before shaping stops it sticking to your fingers.","Per the original recipe: each nugget is roughly 47 kcal, 0g carbs, 2g fat, 7g protein - my own working from the ingredients lands close to that (see Guide for method)."]},{"id":"crispy-beef-cucumber-noodles","name":"Spicy Cucumber Noodle Salad with Crispy Beef","cat":"Beef","serves":2,"freezer":false,"improved":true,"prep":"25 min","blurb":"Built out from a 3-line skeleton: crispy chilli beef mince over cold cucumber ribbons in a sharp, sweet-hot dressing.","link":"https://www.instagram.com/reel/DbTgWg8xSpj/","macros":{"kcal":629,"protein":42,"carbs":21,"fat":41},"ingredients":[{"name":"Beef mince, 10% fat","unit":"g","qty":400,"section":"Crispy beef","alt":null},{"name":"Cornflour","unit":"tbsp","qty":1,"section":"Crispy beef","alt":null},{"name":"Garlic, minced","unit":"cloves","qty":2,"section":"Crispy beef","alt":null},{"name":"Ginger, grated","unit":"tsp","qty":1,"section":"Crispy beef","alt":null},{"name":"Soy sauce","unit":"tbsp","qty":2,"section":"Dressing","alt":null},{"name":"Chilli oil","unit":"tbsp","qty":2,"section":"Dressing","alt":null},{"name":"Rice vinegar","unit":"tbsp","qty":2,"section":"Dressing","alt":null},{"name":"Honey","unit":"tbsp","qty":1,"section":"Dressing","alt":null},{"name":"Toasted sesame oil","unit":"tsp","qty":1,"section":"Dressing","alt":null},{"name":"Chilli flakes","unit":"tsp","qty":1,"section":"Dressing","alt":null},{"name":"Cucumbers, spiralised or peeled into ribbons","unit":"g","qty":600,"section":"Bowl","alt":"was '2 large'"},{"name":"Spring onions","unit":"","qty":3,"section":"Bowl","alt":null},{"name":"Sesame seeds","unit":"tbsp","qty":1,"section":"Bowl","alt":null},{"name":"Coriander","unit":"g","qty":10,"section":"Bowl","alt":null}],"steps":["Toss the beef mince with the cornflour, garlic and ginger until evenly coated.","Fry in a hot, dry pan (or with a very thin film of oil) for 6-8 minutes, breaking it up less than usual and pressing it flat occasionally, until genuinely crispy at the edges rather than just browned.","While the beef cooks, spiralise or peel the cucumbers into long ribbons or noodles. Whisk the soy sauce, chilli oil, rice vinegar, honey, sesame oil and chilli flakes into a dressing.","Toss the cucumber noodles with most of the dressing and pile into bowls.","Top with the crispy beef, drizzle over the rest of the dressing, and finish with spring onion, sesame seeds and coriander. Serve straight away while the beef is still crisp."],"weighing":"Serves 2. This one only exists as a title and three ingredients from the source - I've built out full quantities and a method around it based on the flavour profile in the name (crispy, sharp, chilli-forward). Worth checking the actual reel against this if you want to match it more closely.","tips":["Cornflour on the mince is what gets it properly crispy rather than just browned - don't skip it.","This is a fresh-assembly dish, not a make-ahead one: dressed cucumber weeps within an hour or two, so keep the beef, cucumber and dressing in separate containers and combine just before eating."]},{"id":"sausage-gochujang-rigatoni","name":"Sausage Gochujang Rigatoni","cat":"Pasta","serves":4,"freezer":false,"improved":false,"prep":"20 min","blurb":"Crumbled pork sausage, gochujang and single cream tossed through rigatoni, finished with lime, parmesan and toasted panko.","link":null,"macros":{"kcal":917,"protein":31,"carbs":93,"fat":47},"ingredients":[{"name":"Shallot, minced","unit":"","qty":1,"section":"","alt":null},{"name":"Garlic, minced","unit":"cloves","qty":3,"section":"","alt":null},{"name":"Pork sausages, skins removed","unit":"","qty":6,"section":"","alt":null},{"name":"Butter","unit":"tbsp","qty":2,"section":"","alt":null},{"name":"Gochujang","unit":"tbsp","qty":2,"section":"","alt":null},{"name":"Single cream","unit":"ml","qty":220,"section":"","alt":null},{"name":"Honey","unit":"tbsp","qty":2,"section":"","alt":null},{"name":"Limes","unit":"","qty":2,"section":"","alt":null},{"name":"Parmesan, grated","unit":"g","qty":40,"section":"","alt":null},{"name":"Rigatoni","unit":"g","qty":400,"section":"","alt":null},{"name":"Coriander, chopped","unit":"g","qty":30,"section":"","alt":null},{"name":"Panko breadcrumbs","unit":"g","qty":15,"section":"","alt":null},{"name":"Salt","unit":"tsp","qty":1,"section":"","alt":null},{"name":"Black pepper","unit":"tsp","qty":0.5,"section":"","alt":null},{"name":"Olive oil","unit":"tbsp","qty":1,"section":"","alt":null}],"steps":["Mince the shallot and garlic (photographed step 1 stops here - the rest of the method below is my own, built to standard technique for this dish, since the rest of the card wasn't visible in the photo).","Bring a large pot of salted water to the boil for the rigatoni.","Toast the panko breadcrumbs in a dry pan with the olive oil until golden, then tip out and set aside.","Squeeze the sausage meat out of its skins into a large frying pan with the butter. Break it up and fry over me function DEF(){return {week:{},checked:{},plan:{},photos:{},links:{},sort:'default',have:{},manual:[]};}
var S=DEF();
function blankSlot(){return {dish:null,wife:false};}
function ensure(){
  ['week','checked','plan','photos','links','have'].forEach(function(k){ if(!S[k]||typeof S[k]!=='object'||Array.isArray(S[k])) S[k]={}; });
  if(!Array.isArray(S.manual)) S.manual=[];
  if(!S.sort) S.sort='default';
  Object.keys(S.week).forEach(function(id){ if(!BY_ID[id]) delete S.week[id]; });
  DAYS.forEach(function(d){
    if(!S.plan[d]) S.plan[d]={lunch:blankSlot(),dinner:blankSlot()};
    ['lunch','dinner'].forEach(function(w){
      var sl=S.plan[d][w]; if(!sl||typeof sl!=='object') sl=S.plan[d][w]=blankSlot();
      if(sl.dish&&!BY_ID[sl.dish]){sl.dish=null;sl.wife=false;}
    });
  });
}
function load(){
  try{ var raw=localStorage.getItem(KEY); if(raw){ var o=JSON.parse(raw); S=Object.assign(DEF(),o); } }catch(e){}
  ensure();
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); return true; }catch(e){ return false; }
}
function snapshot(){return JSON.stringify(S);}
function restoreSnap(snap){ try{ S=Object.assign(DEF(),JSON.parse(snap)); ensure(); save(); refresh(); }catch(e){} }

/* ---------- helpers ---------- */
function pDens(r){return r.macros.protein/r.macros.kcal*100;}
function frac(n){
  var r=Math.round(n*4)/4; if(r<0.25) r=0.25;
  var w=Math.floor(r+1e-9), d=Math.round((r-w)*4)/4;
  var g={0:'',0.25:'¼',0.5:'½',0.75:'¾'}[d]||'';
  if(w===0&&g) return g; return String(w)+g;
}
function fmtQ(q,u){
  if(!q) return '';
  if(u==='g'||u==='ml'){ var v=q>=100?Math.round(q/5)*5:Math.round(q); if(v>=1000) return (Math.round(v/50)/20)+(u==='g'?' kg':' l'); return v+' '+u; }
  return frac(q)+(u?' '+u:'');
}
function storageFor(r){

  return {fridge:rice?'1 day':'2 days',freezer:r.freezer===true?'2-3 months':(r.freezer==='partial'?'Parts only':'Do not freeze'),rice:rice};
}

  return {t:'Eat fresh',c:'t-red'};
}

var CATS=['All','Chicken','Beef','Fish','Veg','Pasta','Freezer','High protein'];
var SORTS=[['default','Curated'],['protein','Protein density'],['kcal','Lightest first'],['az','A to Z']];
var filter='All', query='';
function matchFilter(r){
  if(filter==='All') return true;
  if(filter==='Freezer') return r.freezer===true||r.freezer==='partial';
  if(filter==='High protein') return pDens(r)>=6.3;
  return r.cat.toLowerCase().indexOf(filter.toLowerCase())>-1;
}
function sortLabel(){ for(var i=0;i<SORTS.length;i++) if(SORTS[i][0]===S.sort) return SORTS[i][1]; return 'Curated'; }
function visible(){
  var L=RECIPES.filter(matchFilter);
  var toks=query.toLowerCase().split(/\s+/).filter(Boolean);
  if(toks.length) L=L.filter(function(r){ var t=(r.name+' '+r.cat+' '+r.ingredients.map(function(i){return i.name;}).join(' ')).toLowerCase(); return toks.every(function(k){return t.indexOf(k)>-1;}); });
  if(S.sort==='protein') L.sort(function(a,b){return pDens(b)-pDens(a);});
  else if(S.sort==='kcal') L.sort(function(a,b){return a.macros.kcal-b.macros.kcal;});
  else if(S.sort==='az') L.sort(function(a,b){return a.name.localeCompare(b.name);});
  return L;
}

var UNIT_W={g:1,kg:1000}, UNIT_V={ml:1,l:1000,tsp:4.92892,tbsp:14.7868,cup:240,fl_oz:29.5735};

 [/^light butter$|^unsalted butter$|^butter$/i,'Butter'],
 [/^light mayo$|^mayonnaise$|^mayo$/i,'Mayonnaise'],
 [/^light soy$|^light soy sauce$|^soy sauce$/i,'Soy sauce'],
 [/^dark soy$|^dark soy sauce$/i,'Dark soy sauce'],
 [/^sesame oil$|^toasted sesame oil$/i,'Toasted sesame oil'],
 [/^low-fat yogurt$|^plain greek yogurt$|^0% greek yogurt$|^greek yogurt$/i,'Greek yogurt'],
 [/^sour cream$|^light sour cream$/i,'Sour cream'],

 [/^garlic(?: cloves?)?$/i,'Garlic'],
 [/^coriander$/i,'Coriander'],[/^cucumbers?$/i,'Cucumber'],[/^parsley$/i,'Parsley'],
 [/^onions?$/i,'Onion'],[/^red onions?$/i,'Red onion'],
 [/^tomatoes$|^tomato$|^diced tomatoes$/i,'Tomatoes'],

var AISLE_RULES=[

 ['Bakery',/tortilla|\bwraps?\b|bread(?!crumb)|\bbuns?\b|brioche|\brolls?\b|pitta|ciabatta|naan|bagel/i],

 ['Oils, sauces & condiments',/\boil\b|vinegar|\bsoy\b|sauce|worcester|honey|sriracha|gochujang|harissa|miso|nduja|tahini|ketchup|mustard|syrup|maple|mayo|puree|purée|paste|shaoxing|wine|dressing/i],
 ['Store cupboard',/tinned|passata|chickpea|\brice\b|pasta|spaghetti|rigatoni|noodle|panko|breadcrumb|cornflour|\bflour\b|stock cube|lentil|couscous|\boats\b/i],
 ['Meat & fish',/chicken|beef|mince|salmon|sausage|pork|steak|sirloin|rump|turkey|bacon|lamb|duck|prawn|fish|tuna|thigh|breast/i],
 ['Fruit & veg',/onion|shallot|garlic|mushroom|carrot|potato|cucumber|tomato|cabbage|spinach|avocado|jalapeno|jalapeño|lemon|lime|coriander|parsley|chives|basil|ginger|broccoli|choy|salad|gem|lettuce|pepper|chilli|celery|herb|mint|dill|courgette|aubergine/i],

  html+='<div class="addrow"><input id="addIn" type="text" placeholder="Add your own item" autocomplete="off" enterkeyhint="done" aria-label="Add your own item"><button class="btn acc" data-act="addManual">Add</button></div>';
  if(!ids.length&&!S.manual.length){
    html+='<div class="empty"><h3>Nothing to buy yet</h3><p>Pick recipes and the list builds itself, with matching ingredients merged into one line.</p><button class="btn acc" data-act="tab" data-v="browse">Browse recipes</button></div>';
    el.innerHTML=html; return;
  }
  var pct=total?Math.round(done/total*100):0;
  html+='<div class="prog" style="margin-top:14px"><div class="prog-t"><b>'+done+' of '+total+' bought</b><span>'+(total-done)+' to go</span></div><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  var by={}; need.forEach(function(a){(by[a.aisle]=by[a.aisle]||[]).push(a);});
  AISLE_ORDER.forEach(function(ai){
    if(!by[ai]) return;
    by[ai].sort(function(x,y){ var dx=S.checked[x.key]?1:0, dy=S.checked[y.key]?1:0; return dx-dy||x.name.localeCompare(y.name); });
    html+='<div class="aisle"><span>'+esc(ai)+'</span><span>'+by[ai].filter(function(a){return !S.checked[a.key];}).length+' left</span></div><div class="list">'+by[ai].map(itemRow).join('')+'</div>';
  });
  if(S.manual.length){
    html+='<div class="aisle"><span>Added by you</span><span>'+S.manual.filter(function(m){return !m.done;}).length+' left</span></div><div class="list">'+
      S.manual.map(function(m){ return '<div class="item'+(m.done?' done':'')+'" data-act="tickManual" data-id="'+esc(m.id)+'"><span class="tick'+(m.done?' on':'')+'">'+(m.done?ic('check',16):'')+'</span><span class="it-main"><span class="it-name">'+esc(m.name)+'</span></span><button class="it-more" data-act="delManual" data-id="'+esc(m.id)+'" aria-label="Remove '+esc(m.name)+'">'+ic('close',20)+'</button></div>'; }).join('')+'</div>';
  }
  if(have.length){
    html+='<button class="fold" data-act="toggleHave"><span>Already at home</span><small>'+have.length+(showHave?' &middot; hide':' &middot; show')+'</small></button>';
    if(showHave) html+='<div class="list" style="margin-top:10px">'+have.map(function(a){return '<div class="item" data-act="need" data-key="'+esc(a.key)+'"><span class="it-main"><span class="it-name">'+esc(a.name)+'</span><span class="it-for">Tap to add back to your list</span></span><span class="it-q">'+esc(shopQty(a))+'</span></div>';}).join('')+'</div>';
  }
  html+='<p class="hint">Quantities are scaled to your portions and rounded for the shop. Matching ingredients from different recipes are merged. Tap the dots on any item to mark it as already at home.</p>';
  html+='<div class="stack" style="margin-top:18px"><button class="btn danger" data-act="newWeek">Finished? Start a new week</button></div>';
  el.innerHTML=html;
}
function listText(){
  var sh=buildShop().filter(function(a){return !S.have[a.key]&&!S.checked[a.key];}), by={};
  sh.forEach(function(a){(by[a.aisle]=by[a.aisle]||[]).push(a);});
  var t='SHOPPING LIST\n';
  AISLE_ORDER.forEach(function(ai){ if(!by[ai]) return; t+='\n'+ai.toUpperCase()+'\n'; by[ai].sort(function(x,y){return x.name.localeCompare(y.name);}).forEach(function(a){ var q=shopQty(a); t+='- '+a.name+(q?' ('+q+')':'')+'\n'; }); });
  var mm=S.manual.filter(function(m){return !m.done;});
  if(mm.length){ t+='\nEXTRAS\n'; mm.forEach(function(m){t+='- '+m.name+'\n';}); }
  return t;
}
function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(txt);
  return new Promise(function(res,rej){ var ta=document.createElement('textarea'); ta.value=txt; ta.style.cssText='position:fixed;opacity:0;top:0;left:0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy')?res():rej(); }catch(e){rej(e);} document.body.removeChild(ta); });
}

/* ---------- guide ---------- */
function renderGuide(){
  var cred=Object.keys(PHOTOS).filter(function(id){return BY_ID[id];}).map(function(id){
    return '<li><b>'+esc(BY_ID[id].name)+'</b><br><a href="https://commons.wikimedia.org/wiki/File:'+esc(PHOTOS[id])+'" target="_blank" rel="noopener">View file, author and licence</a></li>';
  }).join('');
  $('#v-guide').innerHTML='<header class="hd"><div><h1>Guide</h1><p>Storage, method and backup</p></div></header>'+
  '<div class="gcard"><h4>Fridge and freezer, the short version</h4>'+
   '<div class="grow"><span>Cool cooked food and fridge it within</span><b>1-2 hrs</b></div>'+
   '<div class="grow"><span>Most cooked leftovers, fridge</span><b>2 days</b></div>'+
   '<div class="grow"><span>Cooked rice, fridge</span><b>1 day</b></div>'+
   '<div class="grow"><span>Freezer, best quality</span><b>2-3 months</b></div>'+
   '<div class="grow"><span>Defrost in the fridge, use within</span><b>24 hrs</b></div>'+
   '<div class="grow"><span>Reheat until</span><b>steaming, 75C+</b></div>'+
   '<div class="grow"><span>Reheat any one portion</span><b>once only</b></div>'+
   '<p class="src" style="margin-top:10px">Source: UK Food Standards Agency, food.gov.uk (chilling, freezing and home food fact checker).</p></div>'+
  '<div class="gcard"><h4>The rice rule</h4><p>Rice carries <i>Bacillus cereus</i> spores that survive cooking. If cooked rice sits warm too long, the toxins that form are not destroyed by reheating. The danger is the storage gap, not the reheat.</p><p>Cool within 1 hour (spread it thin), fridge for one day at most, reheat once until steaming. To freeze rice, get it in the freezer within an hour of cooking.</p><p class="src">Source: FSA home food fact checker.</p></div>'+
  '<div class="gcard"><h4>How to portion</h4><p>Raw meat loses roughly a quarter of its weight cooking and rice roughly doubles, so eyeballing from the pan over-serves the first boxes. Cook the batch, weigh the total finished mass, divide by the number of portions and split on the scales.</p></div>'+
  '<div class="gcard"><h4>About the macros</h4><p>Per-portion figures are estimates from standard food-composition values (McCance and Widdowson, USDA, typical UK labels) for the calorie-driving ingredients. Trace spices are excluded. Good for tracking trends and hitting protein, not lab-exact.</p></div>'+
  '<div class="gcard"><h4>Backup</h4><p>Your plan and ticks live in this phone’s browser storage. Clearing Safari website data wipes them, so copy a backup now and then. Photos you add are not included.</p><button class="btn soft" data-act="backup">Backup and restore</button></div>'+
  '<div class="gcard"><h4>Photo credits</h4><p class="src">Recipe photos are openly licensed pictures of similar dishes from Wikimedia Commons, not photos of these exact recipes. Licences vary; each file page shows the author and licence. Add your own photo on any recipe to replace one. Instagram videos play straight from Instagram through its own embed; nothing is copied into this app.</p><ul class="credits">'+cred+'</ul></div>';
}

/* ---------- dialogs ---------- */
function newWeekDialog(){
  openDialog('<h3>Start a new week?</h3><p>This clears your plan, picked recipes, shopping ticks and extra items. Your photos, video links and “at home” list stay. You can undo straight afterwards.</p><div class="dl stack"><button class="btn" data-act="doNewWeek">Start new week</button><button class="btn soft" data-act="closeDialog">Cancel</button></div>');
}
function doNewWeek(){
  var snap=snapshot(); S.week={}; S.plan={}; S.checked={}; S.manual=[]; ensure(); save(); closeDialog(); go('browse'); toast('New week started',function(){restoreSnap(snap);});
}
function sortDialog(){
  openDialog('<h3>Sort recipes</h3><div class="stack" style="margin-top:12px">'+SORTS.map(function(s){return '<button class="btn '+(S.sort===s[0]?'':'soft')+'" data-act="setSort" data-k="'+s[0]+'">'+s[1]+(S.sort===s[0]?' &#10003;':'')+'</button>';}).join('')+'</div>');
}
function backupDialog(){
  var o=JSON.parse(JSON.stringify(S)); o.photos={};
  openDialog('<h3>Backup and restore</h3><p>Copy this text somewhere safe (Notes works). To restore, paste a saved backup over it and tap Restore.</p><textarea id="bk" spellcheck="false">'+esc(JSON.stringify(o))+'</textarea><div class="stack"><button class="btn acc" data-act="copyBk">Copy backup</button><button class="btn" data-act="restoreBk">Restore from text</button><button class="btn soft" data-act="closeDialog">Close</button></div>');
}

/* ---------- navigation ---------- */
function renderView(v){ ({browse:renderBrowse,plan:renderPlan,week:renderWeek,shop:renderShop,guide:renderGuide})[v](); }
function refresh(){ renderView(view); renderBadge(); renderPill(); if(sheetOpen&&sheetKind==='recipe'&&curId) openRecipe(curId,true); }
function go(v){
  closeAll(); view=v;
  $$('.view').forEach(function(x){x.classList.toggle('on',x.id==='v-'+v);});
  $$('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.v===v);});
  renderView(v); renderBadge(); renderPill(); window.scrollTo(0,0);
}

/* ---------- photo upload ---------- */
var pendingPhoto=null;
function onPhoto(e){
  var f=e.target.files&&e.target.files[0]; e.target.value='';
  if(!f||!pendingPhoto) return; var id=pendingPhoto;
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=900, w=img.width, h=img.height, sc=Math.min(1,max/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
      var c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      var prev=S.photos[id]; S.photos[id]=c.toDataURL('image/jpeg',0.72);
      if(!save()){ if(prev) S.photos[id]=prev; else delete S.photos[id]; save(); toast('Storage is full. Remove a photo and try again.'); }
      else toast('Photo saved');
      refresh();
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(f);
}

/* ---------- click handling ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var a=el.dataset.act, d=el.dataset, id=d.id;
  switch(a){
    case 'tab': go(d.v); break;
    case 'open': openRecipe(id); break;
    case 'toggle': toggleWeek(id); break;
    case 'loadEmbed': embedOn[id]=true; refresh(); break;
    case 'watch': var u=linkFor(id); if(u) window.open(u,'_blank','noopener'); break;
    case 'filter': filter=d.c; renderBrowse(); break;
    case 'clearFilter': filter='All'; query=''; $('#q').value=''; renderBrowse(); break;
    case 'sortMenu': sortDialog(); break;
    case 'setSort': S.sort=d.k; save(); closeDialog(); renderBrowse(); break;
    case 'closeSheet': closeSheet(); break;
    case 'closeDialog': closeDialog(); break;
    case 'sstep': var rr=BY_ID[curId]; if(S.week[curId]!=null){ S.week[curId]=Math.max(1,S.week[curId]+(+d.d)); save(); } else { draft[curId]=Math.max(1,(draft[curId]||rr.serves)+(+d.d)); } refresh(); break;
    case 'wstep': S.week[id]=Math.max(1,S.week[id]+(+d.d)); save(); refresh(); break;
    case 'match': S.week[id]=plannedPortions(id)||S.week[id]; save(); refresh(); break;
    case 'pick': openPicker(d.day,d.slot); break;
    case 'assign': assign(id); break;
    case 'clearSlot': S.plan[d.day][d.slot]=blankSlot(); save(); if(d.close) closeSheet(); refresh(); break;
    case 'wife': var sl=S.plan[d.day][d.slot]; sl.wife=!sl.wife; save(); refresh(); break;
    case 'planMenu': openDialog('<h3>Plan options</h3><div class="stack" style="margin-top:12px"><button class="btn" data-act="fillDinners">Fill empty dinners from my picks</button><button class="btn soft" data-act="clearPlan">Clear all meals</button><button class="btn danger" data-act="newWeek">Start a new week</button><button class="btn soft" data-act="closeDialog">Cancel</button></div>'); break;
    case 'fillDinners': fillDinners(); break;
    case 'clearPlan': clearPlan(); break;
    case 'newWeek': closeDialog(); newWeekDialog(); break;
    case 'doNewWeek': doNewWeek(); break;
    case 'tick': if(e.target.closest('.it-more')) break; if(S.checked[d.key]) delete S.checked[d.key]; else S.checked[d.key]=true; save(); var sy=window.scrollY; renderShop(); renderBadge(); window.scrollTo(0,sy); break;
    case 'itemMenu': e.stopPropagation(); var nm=(buildShop().filter(function(x){return x.key===d.key;})[0]||{}).name||'Item';
      openDialog('<h3>'+esc(nm)+'</h3><div class="stack" style="margin-top:12px"><button class="btn" data-act="have" data-key="'+esc(d.key)+'">I already have this at home</button><button class="btn soft" data-act="closeDialog">Cancel</button></div>'); break;
    case 'have': S.have[d.key]=true; delete S.checked[d.key]; save(); closeDialog(); refresh(); toast('Moved to Already at home'); break;
    case 'need': delete S.have[d.key]; save(); refresh(); break;
    case 'toggleHave': showHave=!showHave; renderShop(); break;
    case 'addManual': addManual(); break;
    case 'tickManual': var mi=S.manual.filter(function(m){return m.id===id;})[0]; if(mi){ mi.done=!mi.done; save(); renderShop(); renderBadge(); } break;
    case 'delManual': e.stopPropagation(); S.manual=S.manual.filter(function(m){return m.id!==id;}); save(); renderShop(); renderBadge(); break;
    case 'shopMenu': openDialog('<h3>Shopping list</h3><div class="stack" style="margin-top:12px"><button class="btn" data-act="copyList">Copy what is left to buy</button>'+(navigator.share?'<button class="btn soft" data-act="shareList">Share list</button>':'')+'<button class="btn soft" data-act="untick">Untick everything</button><button class="btn danger" data-act="newWeek">Start a new week</button><button class="btn soft" data-act="closeDialog">Cancel</button></div>'); break;
    case 'copyList': copyText(listText()).then(function(){toast('List copied');},function(){toast('Could not copy');}); closeDialog(); break;
    case 'shareList': navigator.share({title:'Shopping list',text:listText()}).catch(function(){}); closeDialog(); break;
    case 'untick': var s2=snapshot(); S.checked={}; S.manual.forEach(function(m){m.done=false;}); save(); closeDialog(); refresh(); toast('All ticks cleared',function(){restoreSnap(s2);}); break;
    case 'photo': pendingPhoto=id; $('#photoIn').click(); break;
    case 'rmPhoto': delete S.photos[id]; save(); refresh(); break;
    case 'editLink': var cur=linkFor(id)||''; var v=window.prompt('Paste the Instagram (or any) link for this recipe. Leave blank to remove.',cur); if(v===null) break; v=v.trim(); if(v) S.links[id]=v; else delete S.links[id]; save(); refresh(); break;
    case 'backup': backupDialog(); break;
    case 'copyBk': copyText($('#bk').value).then(function(){toast('Backup copied');},function(){toast('Select the text and copy it');}); break;
    case 'restoreBk': try{ var o=JSON.parse($('#bk').value); if(!o||typeof o!=='object'||!o.week||!o.plan) throw new Error('bad'); var keepPhotos=S.photos; var s3=snapshot(); S=Object.assign(DEF(),o); S.photos=keepPhotos; ensure(); save(); closeDialog(); refresh(); toast('Backup restored',function(){restoreSnap(s3);}); }catch(err){ toast('That text is not a valid backup'); } break;
    case 'undo': if(toast.undo){ var fn=toast.undo; toast.undo=null; var t=$('#toast .t'); if(t) t.classList.remove('on'); fn(); } break;
  }
});
function addManual(){
  var i=$('#addIn'); if(!i) return; var v=i.value.trim(); if(!v) return;
  S.manual.push({id:'m'+Date.now(),name:v,done:false}); save(); renderShop(); renderBadge();
  var n=$('#addIn'); if(n) n.focus();
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ if(dialogOpen) closeDialog(); else if(sheetOpen) closeSheet(); }
  if(e.key==='Enter'&&e.target&&e.target.id==='addIn'){ e.preventDefault(); addManual(); }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){ query=t.value; renderBrowse(); }
  else if(t.id==='pq'&&pickCtx){ openPicker(pickCtx.day,pickCtx.which,t.value); }
});
window.addEventListener('pageshow',function(){ if(!sheetOpen&&!dialogOpen) document.documentElement.classList.remove('locked'); });

/* ---------- boot ---------- */
(function boot(){
  load();
  $('#shX').innerHTML=ic('down',22);
  $('#siIcon').innerHTML=ic('search',20);
  var tabs=[['browse','Recipes','grid'],['plan','Plan','cal'],['week','Week','list'],['shop','Shop','basket'],['guide','Guide','info']];
  $('#tabbar').innerHTML=tabs.map(function(t){return '<button class="tab'+(t[0]==='browse'?' on':'')+'" id="tab-'+t[0]+'" data-act="tab" data-v="'+t[0]+'">'+ic(t[2],25)+'<span>'+t[1]+'</span></button>';}).join('');
  $('#photoIn').addEventListener('change',onPhoto);
  go('browse');
})();
})();
</script>
